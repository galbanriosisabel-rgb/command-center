<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Medical Department Command Center — Enhanced</title>
<style>
  :root{
    --bg:#0b0d10; --panel:#11151b; --panel2:#0f1318; --card:#141a22;
    --text:#e7e9ee; --muted:#aab0bd; --border:#263244;
    --red:#d10f2f; --ok:#22c55e; --warn:#f59e0b; --bad:#ef4444; --link:#7dd3fc;
    --shadow:0 12px 30px rgba(0,0,0,.35);
    --r:18px; --r2:14px;
    --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono","Courier New", monospace;
    --sans: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
    --accent: linear-gradient(135deg, #d10f2f 0%, #7dd3fc 100%);
    --accent-glow: 0 0 20px rgba(209, 15, 47, 0.4);
    --transition: all 0.3s ease;
    --chart-bg: rgba(20, 26, 34, 0.9);
  }
  
  /* Animations */
  @keyframes pulse {
    0% { opacity: 1; }
    50% { opacity: 0.7; }
    100% { opacity: 1; }
  }
  
  @keyframes slideIn {
    from { transform: translateY(20px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  
  @keyframes glow {
    0% { box-shadow: 0 0 5px rgba(209, 15, 47, 0.5); }
    50% { box-shadow: 0 0 20px rgba(209, 15, 47, 0.8); }
    100% { box-shadow: 0 0 5px rgba(209, 15, 47, 0.5); }
  }
  
  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  
  @keyframes float {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(-5px); }
  }
  
  *{box-sizing:border-box}
  
  body{
    margin:0; font-family:var(--sans); color:var(--text);
    background: radial-gradient(1200px 600px at 10% 0%, rgba(209,15,47,.18), transparent 55%),
                radial-gradient(900px 600px at 95% 15%, rgba(125,211,252,.12), transparent 60%),
                linear-gradient(180deg, #07080a, #0b0d10 20%, #0b0d10);
    min-height:100vh;
    overflow-x: hidden;
  }
  
  /* Custom scrollbar */
  ::-webkit-scrollbar {
    width: 8px;
    height: 8px;
  }
  
  ::-webkit-scrollbar-track {
    background: rgba(255, 255, 255, 0.05);
    border-radius: 4px;
  }
  
  ::-webkit-scrollbar-thumb {
    background: rgba(209, 15, 47, 0.5);
    border-radius: 4px;
  }
  
  ::-webkit-scrollbar-thumb:hover {
    background: rgba(209, 15, 47, 0.8);
  }
  
  a{color:var(--link); text-decoration:none}
  
  .topbar{
    position:sticky; top:0; z-index:10;
    backdrop-filter: blur(10px);
    background: rgba(9,11,14,.85);
    border-bottom:1px solid rgba(255,255,255,.06);
    animation: slideIn 0.5s ease-out;
  }
  
  .topbar-inner{
    max-width:1200px; margin:0 auto; padding:14px 16px;
    display:flex; align-items:center; gap:12px;
  }
  
  .brand{
    display:flex; align-items:center; gap:10px; min-width:260px;
  }
  
  .dot{
    width:12px; height:12px; border-radius:50%; 
    background:var(--red); 
    box-shadow:0 0 0 6px rgba(209,15,47,.15);
    animation: pulse 2s infinite;
  }
  
  .title{
    font-weight:800; letter-spacing:.2px;
    background: var(--accent);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  
  .subtitle{color:var(--muted); font-size:13px}
  
  .tabs{display:flex; gap:8px; flex:1}
  
  .tab{
    padding:9px 12px; border-radius:999px;
    border:1px solid rgba(255,255,255,.08);
    background: rgba(255,255,255,.03);
    color:var(--text);
    cursor:pointer; user-select:none;
    transition: var(--transition);
    position: relative;
    overflow: hidden;
  }
  
  .tab:hover {
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
  }
  
  .tab.active{
    border-color: rgba(125,211,252,.25); 
    background: rgba(125,211,252,.1);
    box-shadow: inset 0 0 0 1px rgba(125,211,252,.18);
    animation: glow 3s infinite;
  }
  
  .tab::after {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
    transition: left 0.7s;
  }
  
  .tab:hover::after {
    left: 100%;
  }
  
  .actionsBar{display:flex; gap:10px; align-items:center}
  
  .btn{
    display:inline-flex; align-items:center; gap:10px;
    padding:10px 14px; border-radius:999px;
    border:1px solid rgba(255,255,255,.10);
    background: rgba(255,255,255,.03);
    color:var(--text);
    cursor:pointer;
    transition: var(--transition);
  }
  
  .btn.primary{
    border-color: rgba(209,15,47,.45);
    background: linear-gradient(180deg, rgba(209,15,47,.25), rgba(209,15,47,.12));
  }
  
  .btn:hover{
    border-color: rgba(255,255,255,.22);
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
  }
  
  .btn.primary:hover {
    animation: pulse 1s infinite;
    box-shadow: var(--accent-glow);
  }
  
  .btn svg{width:18px; height:18px; fill:currentColor; opacity:.9}
  
  .container{
    max-width:1200px; margin:0 auto; padding:18px 16px 90px;
    animation: fadeIn 0.7s ease-out;
  }
  
  .pageTitle{
    font-size:28px; font-weight:900; margin:14px 0 4px;
    position: relative;
    display: inline-block;
  }
  
  .pageTitle::after {
    content: '';
    position: absolute;
    bottom: -5px;
    left: 0;
    width: 60px;
    height: 3px;
    background: var(--accent);
    border-radius: 2px;
  }
  
  .pageHint{color:var(--muted); margin:0 0 16px}
  
  .grid2{display:grid; grid-template-columns: 1.2fr .8fr; gap:14px}
  
  .kpis{
    display:grid; 
    grid-template-columns: repeat(4, minmax(0,1fr)); 
    gap:12px; 
    margin:10px 0 14px;
  }
  
  .kpi{
    background: rgba(255,255,255,.03);
    border:1px solid rgba(255,255,255,.08);
    border-radius: var(--r);
    padding:14px 14px 12px;
    box-shadow: var(--shadow);
    transition: var(--transition);
    animation: slideIn 0.5s ease-out backwards;
  }
  
  .kpi:hover {
    transform: translateY(-5px);
    box-shadow: 0 15px 35px rgba(0,0,0,0.4);
  }
  
  .kpi .label{display:flex; align-items:center; gap:10px; color:var(--muted); font-weight:700}
  
  .pill{
    display:inline-flex; align-items:center; gap:8px; 
    padding:7px 10px; border-radius:999px;
    border:1px solid rgba(255,255,255,.10); 
    background: rgba(255,255,255,.02); 
    color:var(--text); 
    cursor:pointer;
    transition: var(--transition);
  }
  
  .pill:hover {
    background: rgba(255,255,255,.08);
    transform: scale(1.05);
  }
  
  .pill .miniDot{width:10px; height:10px; border-radius:50%;}
  
  .bigNum{
    font-size:34px; font-weight:900; margin-top:8px;
    background: var(--accent);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  
  .card{
    background: rgba(255,255,255,.03);
    border:1px solid rgba(255,255,255,.08);
    border-radius: var(--r);
    padding:14px;
    box-shadow: var(--shadow);
    transition: var(--transition);
    animation: fadeIn 0.7s ease-out backwards;
  }
  
  .card:hover {
    box-shadow: 0 15px 35px rgba(0,0,0,0.4);
    border-color: rgba(255,255,255,.12);
  }
  
  .card h3{
    margin:0 0 10px; 
    font-size:16px; 
    letter-spacing:.2px;
    color: var(--link);
  }
  
  .tools{
    display:flex; 
    flex-wrap:wrap; 
    gap:10px; 
    align-items:center; 
    margin-bottom:12px;
  }
  
  .input, select, textarea{
    width:100%;
    padding:10px 12px;
    border-radius: 14px;
    border:1px solid rgba(255,255,255,.10);
    background: rgba(0,0,0,.18);
    color: var(--text);
    outline:none;
    transition: var(--transition);
    font-family: var(--sans);
  }
  
  /* FIX: Search input focus */
  .input:focus, select:focus, textarea:focus {
    border-color: rgba(125,211,252,.5);
    box-shadow: 0 0 0 2px rgba(125,211,252,.2);
  }
  
  /* Ensure inputs are immediately clickable */
  .input, select {
    cursor: text;
  }
  
  textarea{min-height:120px; resize:vertical}
  
  .tools .input, .tools select{width:auto; min-width:240px}
  .tools select{min-width:190px}
  
  .mini{color:var(--muted); font-size:12px}
  
  table{width:100%; border-collapse:separate; border-spacing:0}
  th, td{padding:10px 10px; border-bottom:1px solid rgba(255,255,255,.08); vertical-align:top}
  th{color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.12em; text-align:left}
  td{font-size:14px}
  .nowrap{white-space:nowrap}
  
  .cellSelect{
    width:100%;
    padding:8px 10px;
    border-radius: 12px;
    border:1px solid rgba(255,255,255,.10);
    background: rgba(0,0,0,.18);
    color:var(--text);
    transition: var(--transition);
    cursor: pointer;
  }
  
  .cellSelect:focus {
    border-color: rgba(125,211,252,.5);
    box-shadow: 0 0 0 2px rgba(125,211,252,.2);
  }
  
  .rowActions{white-space:nowrap}
  
  .iconBtn{
    display:inline-flex; align-items:center; justify-content:center;
    width:34px; height:34px; border-radius:12px;
    border:1px solid rgba(255,255,255,.10);
    background: rgba(255,255,255,.03);
    color: var(--text);
    cursor:pointer;
    margin-right:6px;
    transition: var(--transition);
  }
  
  .iconBtn svg{width:18px; height:18px; fill:currentColor; opacity:.92}
  .iconBtn.danger{border-color: rgba(239,68,68,.35); color: var(--bad)}
  
  .iconBtn:hover{
    border-color: rgba(255,255,255,.22);
    transform: translateY(-2px) scale(1.1);
    box-shadow: 0 5px 10px rgba(0,0,0,0.2);
  }
  
  .badge{
    display:inline-flex; align-items:center; gap:8px;
    padding:6px 10px; border-radius:999px;
    border:1px solid rgba(255,255,255,.10);
    background: rgba(255,255,255,.02);
    font-size:12px; color:var(--muted);
    transition: var(--transition);
  }
  
  .badge:hover {
    background: rgba(255,255,255,.08);
  }
  
  .badge strong{color:var(--text)}
  
  /* Chart Section Styles */
  .charts-container {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 16px;
    margin-top: 20px;
  }
  
  .chart-card {
    background: var(--chart-bg);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: var(--r);
    padding: 16px;
    box-shadow: var(--shadow);
    transition: var(--transition);
  }
  
  .chart-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 20px 40px rgba(0,0,0,0.5);
  }
  
  .chart-card h3 {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 16px;
    color: var(--text);
  }
  
  .chart-placeholder {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 200px;
    color: var(--muted);
    text-align: center;
    padding: 20px;
    border-radius: 12px;
    background: rgba(0,0,0,.1);
    border: 1px dashed rgba(255,255,255,.1);
  }
  
  .chart-bar-container {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 10px;
  }
  
  .chart-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 12px;
    background: rgba(255,255,255,.03);
    border-radius: 8px;
    border-left: 4px solid;
    transition: var(--transition);
  }
  
  .chart-bar:hover {
    background: rgba(255,255,255,.08);
    transform: translateX(5px);
  }
  
  .chart-bar-label {
    font-weight: 600;
    font-size: 14px;
  }
  
  .chart-bar-value {
    font-weight: 700;
    font-size: 16px;
  }
  
  .stat-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }
  
  .stat-item {
    background: rgba(255,255,255,.03);
    padding: 12px;
    border-radius: 10px;
    border-left: 3px solid;
  }
  
  .stat-label {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 5px;
  }
  
  .stat-value {
    font-size: 20px;
    font-weight: 700;
  }
  
  /* Modal */
  .backdrop{
    position:fixed; inset:0; background:rgba(0,0,0,.6); 
    display:none; z-index:50; align-items:center; justify-content:center; padding:20px;
    animation: fadeIn 0.3s ease-out;
  }
  
  .modal{
    width:min(920px, 95vw);
    background: rgba(15,19,24,.92);
    border:1px solid rgba(255,255,255,.10);
    border-radius: 22px;
    box-shadow: 0 30px 90px rgba(0,0,0,.6);
    overflow:hidden;
    animation: slideIn 0.4s ease-out;
  }
  
  .modalHead{
    display:flex; align-items:center; justify-content:space-between; 
    padding:14px 16px; border-bottom:1px solid rgba(255,255,255,.08)
  }
  
  .modalHead h2{margin:0; font-size:18px}
  
  .modalBody{padding:14px 16px}
  
  .modalGrid{display:grid; grid-template-columns:1fr 1fr; gap:10px}
  
  .modalFoot{
    display:flex; justify-content:space-between; gap:10px; 
    padding:14px 16px; border-top:1px solid rgba(255,255,255,.08)
  }
  
  .toastWrap{
    position:fixed; right:16px; bottom:16px; 
    display:flex; flex-direction:column; gap:10px; z-index:60
  }
  
  .toast{
    background:rgba(15,19,24,.92); 
    border:1px solid rgba(255,255,255,.12); 
    border-radius:16px; 
    padding:10px 12px; 
    box-shadow: var(--shadow); 
    width: min(420px, 92vw);
    animation: slideIn 0.5s ease-out;
  }
  
  .toast .t{font-weight:800}
  .toast .m{color:var(--muted); font-size:13px; margin-top:4px}
  
  /* Assistant - Improved */
  .assistant{
    position:fixed; right:16px; bottom:16px;
    width:min(420px, 92vw);
    max-height: 70vh;
    background: rgba(15,19,24,.95);
    border:1px solid rgba(255,255,255,.12);
    border-radius: 22px;
    box-shadow: 0 30px 80px rgba(0,0,0,.55);
    overflow:hidden;
    display:none;
    z-index:70;
    animation: slideIn 0.5s ease-out;
  }
  
  .assistantHead{
    display:flex; align-items:center; justify-content:space-between; 
    padding:12px 14px; border-bottom:1px solid rgba(255,255,255,.08);
    background: rgba(20,26,34,0.8);
  }
  
  .assistantHead .name{
    display:flex; align-items:center; gap:10px; font-weight:900;
  }
  
  .assistantHead .pending{
    color:var(--muted); font-size:13px;
    animation: pulse 2s infinite;
  }
  
  .assistantBody{
    padding:12px 12px 0; overflow:auto; max-height: calc(70vh - 120px)
  }
  
  .bubble{
    border:1px solid rgba(255,255,255,.10); 
    background: rgba(255,255,255,.03); 
    border-radius: 18px; 
    padding:10px 12px; 
    margin-bottom:10px;
    animation: slideIn 0.3s ease-out;
  }
  
  .bubble.me{
    border-color: rgba(125,211,252,.18);
    background: rgba(125,211,252,.05);
    margin-left: 20px;
  }
  
  .bubble.sys{
    border-color: rgba(34,197,94,.18);
    background: rgba(34,197,94,.05);
    margin-right: 20px;
  }
  
  .bubble .small{
    color:var(--muted); font-size:12px; margin-top:6px;
  }
  
  .assistantFoot{
    padding:12px; border-top:1px solid rgba(255,255,255,.08); 
    display:flex; gap:10px;
    background: rgba(20,26,34,0.8);
  }
  
  .assistantFoot input{
    flex:1;
    /* FIX: Ensure input is immediately clickable */
    cursor: text;
  }
  
  .assistantFoot input:focus {
    border-color: rgba(125,211,252,.5);
    box-shadow: 0 0 0 2px rgba(125,211,252,.2);
  }
  
  .ghostBtn{
    background:transparent; border:1px solid rgba(255,255,255,.10); 
    color:var(--text); border-radius:999px; padding:9px 12px; cursor:pointer;
    transition: var(--transition);
  }
  
  .ghostBtn:hover{
    border-color: rgba(255,255,255,.22);
    background: rgba(255,255,255,.05);
  }
  
  /* Assistant command suggestions */
  .command-suggestions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 10px;
    padding: 8px;
    background: rgba(255,255,255,.02);
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,.05);
  }
  
  .command-chip {
    padding: 6px 10px;
    background: rgba(125,211,252,.1);
    border: 1px solid rgba(125,211,252,.2);
    border-radius: 999px;
    font-size: 12px;
    cursor: pointer;
    transition: var(--transition);
  }
  
  .command-chip:hover {
    background: rgba(125,211,252,.2);
    transform: scale(1.05);
  }
  
  /* Visual effects */
  .glowing-dot {
    position: relative;
  }
  
  .glowing-dot::after {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--red);
    filter: blur(8px);
    opacity: 0.7;
    z-index: -1;
  }
  
  .floating {
    animation: float 3s ease-in-out infinite;
  }
  
  @media (max-width: 980px){
    .grid2{grid-template-columns: 1fr}
    .kpis{grid-template-columns: repeat(2, minmax(0,1fr))}
    .brand{min-width:auto}
    .tabs{display:none}
    .charts-container {
      grid-template-columns: 1fr;
    }
    .stat-grid {
      grid-template-columns: 1fr;
    }
  }
</style>
</head>
<body>
  <div class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <div class="dot glowing-dot"></div>
        <div>
          <div class="title">Command Center</div>
          <div class="subtitle">Medical Department • Enhanced</div>
        </div>
      </div>

      <div class="tabs" id="tabs"></div>

      <div class="actionsBar">
        <button class="btn floating" id="btnToggleAssistant" title="Toggle assistant">
          <svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-7 7v4a3 3 0 0 0 3 3h1v3l3-3h3a3 3 0 0 0 3-3V9a7 7 0 0 0-7-7zm-2 9h4v2h-4v-2zm0-4h4v2h-4V7z"/></svg>
          Assistant
        </button>
        <button class="btn" id="btnDownload" title="Download CSV">
          <svg viewBox="0 0 24 24"><path d="M5 20h14v-2H5v2zM12 2v12l4-4 1.4 1.4L12 18l-5.4-5.6L8 10l4 4V2h0z"/></svg>
          Export Data
        </button>
        <button class="btn primary" id="btnGenerate" title="Generate 4pm draft">
          <svg viewBox="0 0 24 24"><path d="M19 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V7l-4-4zm-2 16H7v-2h10v2zm0-4H7v-2h10v2zm-3-7H6V6h8v2z"/></svg>
          Generate Report
        </button>
      </div>
    </div>
  </div>

  <div class="container">
    <div id="page"></div>
  </div>

  <!-- Modal -->
  <div class="backdrop" id="backdrop">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modalHead">
        <h2 id="modalTitle">Modal</h2>
        <button class="ghostBtn" id="modalClose">✕ Close</button>
      </div>
      <div class="modalBody" id="modalBody"></div>
      <div class="modalFoot">
        <div class="mini" id="modalHint"></div>
        <div style="display:flex; gap:10px">
          <button class="ghostBtn" id="modalCancel">Cancel</button>
          <button class="btn primary" id="modalSave">Save</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Assistant -->
  <div class="assistant" id="assistant">
    <div class="assistantHead">
      <div class="name"><span class="dot" style="width:10px;height:10px;box-shadow:none"></span> Isabel's Assistant</div>
      <div class="pending"><span id="pendingCount">0</span> pending</div>
    </div>
    <div class="assistantBody" id="assistantBody">
      <!-- Command suggestions will be inserted here -->
      <div id="commandSuggestions" class="command-suggestions"></div>
    </div>
    <div class="assistantFoot">
      <input class="input" id="assistantInput" placeholder="Ask me anything: 'show pending', 'update patient', 'export data', 'generate report'"/>
      <button class="btn primary" id="assistantSend">Send</button>
    </div>
  </div>

  <div class="toastWrap" id="toasts"></div>

<script>
(() => {
  // -----------------------------
  // Icons
  // -----------------------------
  const ICON_EDIT = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zm2.92 2.33H5v-.92l9.06-9.06.92.92L5.92 19.58zM20.71 7.04a1 1 0 0 0 0-1.41L18.37 3.29a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>`;
  const ICON_TRASH = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 7h12l-1 14H7L6 7zm3-3h6l1 2H8l1-2z"/></svg>`;
  const ICON_EMAIL = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 4-8 5L4 8V6l8 5 8-5v2z"/></svg>`;
  const ICON_SAVE = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V7l-4-4zM12 19a3 3 0 1 1 0-6 3 3 0 0 1 0 6zM6 8V5h10v3H6z"/></svg>`;
  const ICON_CHART = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg>`;

  // -----------------------------
  // Options (Dropdowns)
  // -----------------------------
  const OPTIONS = {
    patientTypes: ["MRI","PT","Chiro/PT","Chiro","Ortho","Neuro","Pain Mgmt","Other"],
    patientStatus: ["New","Sent to clinic","Stuck","Needs reply","Done"],
    waitingOn: ["Clinic","You","Attorney","Client","Records","Scheduling","Transportation","Other"],
    taskType: ["Follow-up clinic","Reply email","Update Clio","Send referral","Other"],
    taskPriority: ["High","Medium","Low"],
    taskProgress: ["Open","Done","Updated"]
  };

  // -----------------------------
  // State
  // -----------------------------
  const STORAGE_KEY = "command_center_v6";
  const defaultState = () => ({
    ui: { tab:"Home", patientSearch:"", patientStatus:"all", patientWaiting:"all", taskSearch:"", reportEditingId:null },
    patients: [],
    tasks: [],
    reports: [],
    assistant: { open:false, chat:[], lastMatter:null, pending:0 }
  });

  let state = loadState();

  // -----------------------------
  // Helpers
  // -----------------------------
  const $ = (q, root=document) => root.querySelector(q);
  const $$ = (q, root=document) => Array.from(root.querySelectorAll(q));
  const norm = (s)=> (s??"").toString().trim();
  const lower = (s)=> norm(s).toLowerCase();
  const escapeHtml = (s)=> norm(s).replace(/[&<>"']/g, c=>({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
  const buildOptions = (list, selected) => list.map(v => `<option value="${escapeHtml(v)}" ${v===selected?"selected":""}>${escapeHtml(v)}</option>`).join("");
  const nowStamp = () => new Date().toLocaleString();
  const cryptoId = () => (crypto?.randomUUID?.() || ("id_"+Math.random().toString(16).slice(2)+Date.now()));
  
  function toast(title, msg){
    const wrap = $("#toasts");
    const el = document.createElement("div");
    el.className="toast";
    el.innerHTML = `<div class="t">${escapeHtml(title)}</div><div class="m">${escapeHtml(msg)}</div>`;
    wrap.appendChild(el);
    setTimeout(()=>{ el.style.opacity="0"; el.style.transform="translateY(6px)"; }, 3400);
    setTimeout(()=> el.remove(), 4200);
  }

  function saveState(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){ console.warn(e); }
    $("#pendingCount").textContent = String(state.assistant.pending||0);
  }
  
  function loadState(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return defaultState();
      const parsed = JSON.parse(raw);
      // merge for forward compatibility
      return {...defaultState(), ...parsed, ui:{...defaultState().ui, ...(parsed.ui||{})}, assistant:{...defaultState().assistant, ...(parsed.assistant||{})}};
    }catch(e){
      return defaultState();
    }
  }

  // -----------------------------
  // Modal
  // -----------------------------
  const backdrop = $("#backdrop");
  const modalTitle = $("#modalTitle");
  const modalBody = $("#modalBody");
  const modalHint = $("#modalHint");
  let modalOnSave = null;

  function openModal(title, html, hint, onSave){
    modalTitle.textContent = title;
    modalBody.innerHTML = html;
    modalHint.textContent = hint || "";
    modalOnSave = onSave || null;
    backdrop.style.display="flex";
    
    // FIX: Focus first input in modal
    setTimeout(() => {
      const firstInput = modalBody.querySelector('input, select, textarea');
      if (firstInput) firstInput.focus();
    }, 100);
  }
  
  function closeModal(){
    backdrop.style.display="none";
    modalBody.innerHTML = "";
    modalOnSave = null;
  }
  
  $("#modalClose").addEventListener("click", closeModal);
  $("#modalCancel").addEventListener("click", closeModal);
  $("#modalSave").addEventListener("click", () => { if(modalOnSave) modalOnSave(); });

  // -----------------------------
  // Rendering
  // -----------------------------
  const TABS = ["Home","Patients","Tasks","Charts","Reports"]; // Added Charts tab

  function renderTabs(){
    const el = $("#tabs");
    el.innerHTML = TABS.map(t => `<div class="tab ${state.ui.tab===t?"active":""}" data-tab="${t}">${t}</div>`).join("");
  }

  function render(){
    renderTabs();
    renderAssistant();
    const page = $("#page");
    if(state.ui.tab==="Home") page.innerHTML = renderHome();
    if(state.ui.tab==="Patients") page.innerHTML = renderPatients();
    if(state.ui.tab==="Tasks") page.innerHTML = renderTasks();
    if(state.ui.tab==="Charts") page.innerHTML = renderCharts(); // New Charts section
    if(state.ui.tab==="Reports") page.innerHTML = renderReports();
    wirePage();
    saveState();
  }

  function kpi(label, value, dotColor, pillText, pillAction){
    return `
      <div class="kpi">
        <div class="label">
          <span class="miniDot" style="background:${dotColor}"></span>
          <span>${escapeHtml(label)}</span>
        </div>
        <div class="bigNum">${value}</div>
        <div style="margin-top:10px">
          <span class="pill" data-action="${pillAction||""}">
            <span class="miniDot" style="background:${dotColor}"></span>
            ${escapeHtml(pillText||"filter")}
          </span>
        </div>
      </div>
    `;
  }

  function computeHome(){
    const today = new Date().toISOString().slice(0,10);
    const overdue = state.tasks.filter(t => lower(t.progress)==="open" && t.dueDate && t.dueDate < today).length;
    const needsReply = state.patients.filter(p => lower(p.status)==="needs reply").length
                    + state.tasks.filter(t => lower(t.taskType).includes("reply") && lower(t.progress)==="open").length;
    const newToday = state.patients.filter(p => (p.createdAt||"").slice(0,10)===today).length;
    const waitingClinic = state.patients.filter(p => lower(p.waitingOn)==="clinic" && lower(p.status)!=="done").length;
    return { overdue, needsReply, newToday, waitingClinic };
  }

  function renderHome(){
    const { overdue, needsReply, newToday, waitingClinic } = computeHome();
    const priorityPatients = state.patients.slice(0, 12);
    const inbox = state.tasks.filter(t => lower(t.progress)==="open").slice(0, 12);

    return `
      <div class="pageTitle">Dashboard</div>
      <p class="pageHint">Quick view of what matters today</p>

      <div class="kpis">
        ${kpi("Overdue today", overdue, "var(--bad)", "follow-up overdue", "home_overdue")}
        ${kpi("Needs reply", needsReply, "var(--warn)", "reply today", "home_needs_reply")}
        ${kpi("New today", newToday, "var(--ok)", "created today", "home_new_today")}
        ${kpi("Waiting on clinic", waitingClinic, "var(--muted)", "no response", "home_waiting_clinic")}
      </div>

      <div class="grid2">
        <div class="card">
          <h3>📌 Priority Patients (Today)</h3>
          <div class="tools">
            <span class="badge">Tip: click a KPI tag above to filter lists.</span>
          </div>
          ${tablePatients(priorityPatients, {compact:true})}
        </div>

        <div class="card">
          <h3>📨 Action Inbox (Email → Tasks)</h3>
          ${tableTasks(inbox, {compact:true})}
        </div>
      </div>
    `;
  }

  function tablePatients(list, {compact=false}={}){
    if(list.length===0){
      return `<div class="mini">No patients yet. Use <strong>Quick Log</strong> to add one.</div>`;
    }
    const rows = list.map(p => {
      const matter = escapeHtml(p.matter);
      const statusSel = `<select class="cellSelect" data-action="p_update" data-field="status" data-matter="${matter}">
        ${buildOptions(OPTIONS.patientStatus, p.status||"New")}
      </select>`;
      const waitSel = `<select class="cellSelect" data-action="p_update" data-field="waitingOn" data-matter="${matter}">
        ${buildOptions(OPTIONS.waitingOn, p.waitingOn||"Clinic")}
      </select>`;
      const typeSel = `<select class="cellSelect" data-action="p_update" data-field="type" data-matter="${matter}">
        ${buildOptions(OPTIONS.patientTypes, p.type||"MRI")}
      </select>`;

      return `
        <tr>
          <td class="nowrap"><a class="link" data-action="open_patient" data-matter="${matter}">${matter}</a></td>
          <td>${escapeHtml(p.patient||"")}</td>
          <td class="nowrap">${escapeHtml(p.state||"")}</td>
          ${compact ? "" : `<td>${typeSel}</td>`}
          <td>${escapeHtml(p.provider||"")}</td>
          ${compact ? "" : `<td class="nowrap">${escapeHtml(p.requestedDate||"")}</td>`}
          ${compact ? "" : `<td>${escapeHtml(p.sender||"")}</td>`}
          <td>${statusSel}</td>
          <td>${waitSel}</td>
          ${compact ? "" : `<td style="max-width:320px">${escapeHtml(p.notes||"")}</td>`}
          <td class="rowActions">
            <button class="iconBtn" data-action="edit_patient" data-matter="${matter}" title="Edit">${ICON_EDIT}</button>
            <button class="iconBtn danger" data-action="del_patient" data-matter="${matter}" title="Delete">${ICON_TRASH}</button>
          </td>
        </tr>
      `;
    }).join("");

    const head = `
      <tr>
        <th>Matter</th><th>Patient</th><th>State</th>
        ${compact ? "" : "<th>Type</th>"}
        <th>Provider</th>
        ${compact ? "" : "<th>Requested</th><th>Sender</th>"}
        <th>Status</th><th>Waiting On</th>
        ${compact ? "" : "<th>Notes</th>"}
        <th></th>
      </tr>
    `;

    return `
      <div style="overflow:auto">
        <table>
          <thead>${head}</thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    `;
  }

  function renderPatients(){
    return `
      <div class="pageTitle">Patients</div>
      <p class="pageHint">Your operational list</p>

      <div class="card">
        <div class="tools">
          <input class="input" id="patientSearch" placeholder="Search by patient, matter, state, provider, notes" value="${escapeHtml(state.ui.patientSearch||"")}"/>
          <select id="patientStatusFilter">
            ${["all", ...OPTIONS.patientStatus].map(v=>`<option value="${v}" ${state.ui.patientStatus===v?"selected":""}>Status (${v})</option>`).join("")}
          </select>
          <select id="patientWaitingFilter">
            ${["all", ...OPTIONS.waitingOn].map(v=>`<option value="${v}" ${state.ui.patientWaiting===v?"selected":""}>Waiting (${v})</option>`).join("")}
          </select>
          <button class="btn" id="btnQuickPatient">+ Quick Log</button>
          <button class="btn" id="patientClear">Clear</button>
        </div>

        ${tablePatients(filteredPatients(), {compact:false})}
        <div class="mini" style="margin-top:8px">Quick Log adds a new patient row (auto-saved on your device).</div>
      </div>
    `;
  }

  function filteredPatients(){
    const q = lower(state.ui.patientSearch);
    const status = state.ui.patientStatus;
    const waiting = state.ui.patientWaiting;

    return state.patients
      .filter(p => {
        const hay = lower([p.matter,p.patient,p.state,p.type,p.provider,p.requestedDate,p.sender,p.status,p.waitingOn,p.notes].join(" "));
        if(q && !hay.includes(q)) return false;
        if(status && status!=="all" && norm(p.status)!==status) return false;
        if(waiting && waiting!=="all" && norm(p.waitingOn)!==waiting) return false;
        return true;
      });
  }

  function tableTasks(list, {compact=false}={}){
    if(list.length===0){
      return `<div class="mini">No tasks yet. Use <strong>Quick Log</strong> to add one.</div>`;
    }
    const rows = list.map(t => {
      const id = escapeHtml(t.id);
      const matter = escapeHtml(t.matter||"");
      const typeSel = `<select class="cellSelect" data-action="t_update" data-field="taskType" data-id="${id}">
        ${buildOptions(OPTIONS.taskType, t.taskType||"Follow-up clinic")}
      </select>`;
      const prSel = `<select class="cellSelect" data-action="t_update" data-field="priority" data-id="${id}">
        ${buildOptions(OPTIONS.taskPriority, t.priority||"Medium")}
      </select>`;
      const progSel = `<select class="cellSelect" data-action="t_update" data-field="progress" data-id="${id}">
        ${buildOptions(OPTIONS.taskProgress, t.progress||"Open")}
      </select>`;

      return `
        <tr>
          <td class="nowrap"><a class="link" data-action="open_patient" data-matter="${matter}">${matter||"-"}</a></td>
          ${compact ? "" : `<td>${typeSel}</td>`}
          <td>${prSel}</td>
          <td>${progSel}</td>
          <td style="max-width:360px">${escapeHtml(t.description||"")}</td>
          <td class="rowActions">
            <button class="iconBtn" data-action="edit_task" data-id="${id}" title="Edit">${ICON_EDIT}</button>
            <button class="iconBtn danger" data-action="del_task" data-id="${id}" title="Delete">${ICON_TRASH}</button>
          </td>
        </tr>
      `;
    }).join("");

    const head = `
      <tr>
        <th>Matter</th>
        ${compact ? "" : "<th>Type</th>"}
        <th>Priority</th><th>Progress</th><th>Description</th><th></th>
      </tr>
    `;

    return `
      <div style="overflow:auto">
        <table>
          <thead>${head}</thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    `;
  }

  function renderTasks(){
    return `
      <div class="pageTitle">Tasks</div>
      <p class="pageHint">Action list</p>

      <div class="card">
        <div class="tools">
          <input class="input" id="taskSearch" placeholder="Search by matter, type, description" value="${escapeHtml(state.ui.taskSearch||"")}"/>
          <button class="btn" id="btnQuickTask">+ Quick Log</button>
          <button class="btn" id="taskClear">Clear</button>
        </div>

        ${tableTasks(filteredTasks(), {compact:false})}
        <div class="mini" style="margin-top:8px">Tasks are auto-saved on your device.</div>
      </div>
    `;
  }

  function filteredTasks(){
    const q = lower(state.ui.taskSearch);
    return state.tasks.filter(t => {
      const hay = lower([t.matter,t.taskType,t.priority,t.progress,t.description].join(" "));
      return !q || hay.includes(q);
    });
  }

  // NEW: Charts Section
  function renderCharts(){
    // Calculate chart data
    const statusCounts = {};
    const waitingCounts = {};
    const typeCounts = {};
    const priorityCounts = {};
    
    OPTIONS.patientStatus.forEach(s => statusCounts[s] = 0);
    OPTIONS.waitingOn.forEach(w => waitingCounts[w] = 0);
    OPTIONS.patientTypes.forEach(t => typeCounts[t] = 0);
    OPTIONS.taskPriority.forEach(p => priorityCounts[p] = 0);
    
    state.patients.forEach(p => {
      if(p.status) statusCounts[p.status] = (statusCounts[p.status] || 0) + 1;
      if(p.waitingOn) waitingCounts[p.waitingOn] = (waitingCounts[p.waitingOn] || 0) + 1;
      if(p.type) typeCounts[p.type] = (typeCounts[p.type] || 0) + 1;
    });
    
    state.tasks.forEach(t => {
      if(t.priority) priorityCounts[t.priority] = (priorityCounts[t.priority] || 0) + 1;
    });
    
    // Sort and get top categories
    const topStatuses = Object.entries(statusCounts)
      .sort((a,b) => b[1] - a[1])
      .slice(0, 5);
    
    const topWaiting = Object.entries(waitingCounts)
      .sort((a,b) => b[1] - a[1])
      .slice(0, 5);
    
    const topTypes = Object.entries(typeCounts)
      .sort((a,b) => b[1] - a[1])
      .slice(0, 5);
    
    // Color palette
    const colors = ["#d10f2f", "#7dd3fc", "#22c55e", "#f59e0b", "#a855f7", "#ef4444", "#3b82f6"];
    
    return `
      <div class="pageTitle">Charts & Analytics</div>
      <p class="pageHint">Visual overview of your data</p>
      
      <div class="card">
        <h3>📊 Summary Statistics</h3>
        <div class="stat-grid">
          <div class="stat-item" style="border-left-color: #d10f2f">
            <div class="stat-label">Total Patients</div>
            <div class="stat-value">${state.patients.length}</div>
          </div>
          <div class="stat-item" style="border-left-color: #7dd3fc">
            <div class="stat-label">Open Tasks</div>
            <div class="stat-value">${state.tasks.filter(t => t.progress === 'Open').length}</div>
          </div>
          <div class="stat-item" style="border-left-color: #22c55e">
            <div class="stat-label">Patients Today</div>
            <div class="stat-value">${state.patients.filter(p => new Date(p.createdAt).toDateString() === new Date().toDateString()).length}</div>
          </div>
          <div class="stat-item" style="border-left-color: #f59e0b">
            <div class="stat-label">Needs Reply</div>
            <div class="stat-value">${state.patients.filter(p => p.status === 'Needs reply').length}</div>
          </div>
        </div>
      </div>
      
      <div class="charts-container">
        <div class="chart-card">
          <h3>${ICON_CHART} Patient Status Distribution</h3>
          <div class="chart-bar-container">
            ${topStatuses.map(([status, count], i) => `
              <div class="chart-bar" style="border-left-color: ${colors[i % colors.length]}">
                <div class="chart-bar-label">${escapeHtml(status)}</div>
                <div class="chart-bar-value">${count}</div>
              </div>
            `).join('')}
          </div>
        </div>
        
        <div class="chart-card">
          <h3>${ICON_CHART} Waiting On Distribution</h3>
          <div class="chart-bar-container">
            ${topWaiting.map(([waiting, count], i) => `
              <div class="chart-bar" style="border-left-color: ${colors[(i+2) % colors.length]}">
                <div class="chart-bar-label">${escapeHtml(waiting)}</div>
                <div class="chart-bar-value">${count}</div>
              </div>
            `).join('')}
          </div>
        </div>
        
        <div class="chart-card">
          <h3>${ICON_CHART} Patient Types</h3>
          <div class="chart-bar-container">
            ${topTypes.map(([type, count], i) => `
              <div class="chart-bar" style="border-left-color: ${colors[(i+4) % colors.length]}">
                <div class="chart-bar-label">${escapeHtml(type)}</div>
                <div class="chart-bar-value">${count}</div>
              </div>
            `).join('')}
          </div>
        </div>
        
        <div class="chart-card">
          <h3>${ICON_CHART} Task Priority</h3>
          <div class="chart-bar-container">
            ${Object.entries(priorityCounts).map(([priority, count], i) => `
              <div class="chart-bar" style="border-left-color: ${colors[(i+1) % colors.length]}">
                <div class="chart-bar-label">${escapeHtml(priority)}</div>
                <div class="chart-bar-value">${count}</div>
              </div>
            `).join('')}
          </div>
        </div>
      </div>
      
      <div class="card" style="margin-top: 20px;">
        <h3>📈 Data Trends</h3>
        <div class="mini">
          <p>This section provides visual insights into your patient and task data. Use these charts to identify patterns and prioritize your work.</p>
          <p><strong>Total Records:</strong> ${state.patients.length} patients, ${state.tasks.length} tasks, ${state.reports.length} saved reports</p>
          <p><strong>Last Update:</strong> ${new Date().toLocaleString()}</p>
        </div>
      </div>
    `;
  }

  function renderReports(){
    const current = state.ui.reportEditingId ? state.reports.find(r => r.id===state.ui.reportEditingId) : null;
    const label = state.ui.reportEditingId ? `Editing saved report • ${current ? current.when : ""}` : "4pm report";

    return `
      <div class="pageTitle">Reports</div>
      <p class="pageHint">${escapeHtml(label)}</p>

      <div class="card">
        <h3>📊 4pm report</h3>
        <div class="mini">Generate, copy, and save your daily report. Saves are tracked.</div>

        <div style="margin-top:12px">
          <textarea id="reportText" class="input" placeholder="Click Generate 4pm Draft…" style="min-height:150px">${escapeHtml(state.ui.reportEditingId ? (current?.text||"") : (state.ui.currentDraft||""))}</textarea>
        </div>

        <div style="display:flex; gap:10px; margin-top:10px; flex-wrap:wrap">
          <button class="btn primary" id="btnGenerateHere">${ICON_SAVE} Generate</button>
          <button class="btn" id="btnCopyReport">Copy</button>
          <button class="btn" id="btnSaveReport">${ICON_SAVE} Save</button>
          <button class="btn" id="btnClearReport">Clear</button>
        </div>

        <div style="margin-top:18px">
          <h3 style="margin-bottom:8px">Report Save Log</h3>
          ${renderReportLog()}
        </div>
      </div>
    `;
  }

  function renderReportLog(){
    if(state.reports.length===0){
      return `<div class="mini">No saved reports yet.</div>`;
    }
    const rows = state.reports.map(r => `
      <tr>
        <td class="nowrap">${escapeHtml(r.when)}</td>
        <td style="max-width:520px">${escapeHtml((r.text||"").slice(0,120))}${(r.text||"").length>120?"…":""}</td>
        <td class="rowActions">
          <button class="iconBtn" data-action="edit_report" data-id="${escapeHtml(r.id)}" title="Edit">${ICON_EDIT}</button>
          <button class="iconBtn danger" data-action="del_report" data-id="${escapeHtml(r.id)}" title="Delete">${ICON_TRASH}</button>
        </td>
      </tr>
    `).join("");

    return `
      <div style="overflow:auto">
        <table>
          <thead><tr><th>Date/Time</th><th>Preview</th><th></th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    `;
  }

  // -----------------------------
  // Page wiring (events)
  // -----------------------------
  function wirePage(){
    // Tabs (mobile: click on tabs when visible)
    $$(".tab").forEach(t => t.addEventListener("click", () => { 
      state.ui.tab = t.dataset.tab; 
      render(); 
    }));

    // Home KPI pills
    $$("[data-action^='home_']").forEach(el => el.addEventListener("click", () => {
      if(el.dataset.action==="home_needs_reply"){ state.ui.tab="Patients"; state.ui.patientStatus="Needs reply"; state.ui.patientWaiting="all"; state.ui.patientSearch=""; }
      if(el.dataset.action==="home_waiting_clinic"){ state.ui.tab="Patients"; state.ui.patientWaiting="Clinic"; state.ui.patientStatus="all"; state.ui.patientSearch=""; }
      if(el.dataset.action==="home_new_today"){ state.ui.tab="Patients"; state.ui.patientStatus="all"; state.ui.patientWaiting="all"; state.ui.patientSearch=""; }
      if(el.dataset.action==="home_overdue"){ state.ui.tab="Tasks"; state.ui.taskSearch=""; }
      render();
    }));

    // Patients tools - FIX: Ensure inputs are immediately focusable
    const ps = $("#patientSearch");

      });

      $("#patientWaitingFilter").addEventListener("change", (e)=>{ state.ui.patientWaiting = e.target.value; render(); });
      $("#patientClear").addEventListener("click", ()=>{ state.ui.patientSearch=""; state.ui.patientStatus="all"; state.ui.patientWaiting="all"; render(); });
      $("#btnQuickPatient").addEventListener("click", openQuickPatient);
    }

    // Tasks tools - FIX: Ensure inputs are immediately focusable
    const ts = $("#taskSearch");
    if(ts){
      // Ensure focus works immediately
      ts.addEventListener("focus", (e) => e.target.select());
      ts.addEventListener("input", () => { 
        state.ui.taskSearch = ts.value; 
        saveState(); 
        render(); 
      });
      $("#taskClear").addEventListener("click", ()=>{ state.ui.taskSearch=""; render(); });
      $("#btnQuickTask").addEventListener("click", openQuickTask);
    }

    // Reports tools
    if($("#reportText")){
      $("#btnGenerateHere").addEventListener("click", () => { generateDraftInto("#reportText"); });
      $("#btnCopyReport").addEventListener("click", copyReport);
      $("#btnSaveReport").addEventListener("click", saveReportFromTextarea);
      $("#btnClearReport").addEventListener("click", ()=>{ state.ui.reportEditingId=null; state.ui.currentDraft=""; render(); });
    }

    // Delegated actions
    $("#page").addEventListener("click", (e)=>{
      const actEl = e.target.closest("[data-action]");
      if(!actEl) return;
      const action = actEl.dataset.action;

      if(action==="open_patient"){
        state.ui.tab="Patients";
        state.ui.patientSearch = actEl.dataset.matter || "";
        state.ui.patientStatus="all";
        state.ui.patientWaiting="all";
        state.assistant.lastMatter = actEl.dataset.matter || null;
        render();
        return;
      }
      if(action==="edit_patient"){ editPatient(actEl.dataset.matter); return; }
      if(action==="del_patient"){ deletePatient(actEl.dataset.matter); return; }
      if(action==="edit_task"){ editTask(actEl.dataset.id); return; }
      if(action==="del_task"){ deleteTask(actEl.dataset.id); return; }
      if(action==="edit_report"){ state.ui.tab="Reports"; state.ui.reportEditingId = actEl.dataset.id; render(); return; }
      if(action==="del_report"){ deleteReport(actEl.dataset.id); return; }
    });

    $("#page").addEventListener("change", (e)=>{
      const sel = e.target.closest("[data-action='p_update'], [data-action='t_update']");
      if(!sel) return;

      if(sel.dataset.action==="p_update"){
        const matter = sel.dataset.matter;
        const field = sel.dataset.field;
        updatePatientField(matter, field, sel.value);
      }
      if(sel.dataset.action==="t_update"){
        const id = sel.dataset.id;
        const field = sel.dataset.field;
        updateTaskField(id, field, sel.value);
      }
    });
  }

  function generateDraft(){
    const openTasks = state.tasks.filter(t => lower(t.progress)==="open");
    const needsReply = state.patients.filter(p => lower(p.status)==="needs reply");
    const waitingClinic = state.patients.filter(p => lower(p.waitingOn)==="clinic" && lower(p.status)!=="done");

    const lines = [];
    lines.push(`4pm Report — ${nowStamp()}`);
    lines.push("");
    lines.push(`Patients waiting on clinic: ${waitingClinic.length}`);
    for(const p of waitingClinic.slice(0,12)){
      lines.push(`- ${p.matter}: ${p.patient} • ${p.type||""} • Provider: ${p.provider||""} • Status: ${p.status||""} • Notes: ${p.notes||""}`.trim());
    }
    lines.push("");
    lines.push(`Needs reply: ${needsReply.length}`);
    for(const p of needsReply.slice(0,12)){
      lines.push(`- ${p.matter}: ${p.patient} • Provider: ${p.provider||""} • Notes: ${p.notes||""}`.trim());
    }
    lines.push("");
    lines.push(`Open tasks: ${openTasks.length}`);
    for(const t of openTasks.slice(0,18)){
      lines.push(`- ${t.matter}: [${t.priority}] ${t.taskType} — ${t.description}`.trim());
    }
    lines.push("");
    lines.push("End.");
    return lines.join("\n");
  }

  function generateDraftInto(selector){
    const draft = generateDraft();
    const ta = $(selector);
    if(ta) ta.value = draft;
    state.ui.currentDraft = draft;
    state.ui.reportEditingId = null;
    toast("Draft generated","4pm draft was generated from current Patients + Tasks.");

    state.ui.currentDraft = text;

  function renderAssistant(){
    const panel = $("#assistant");
    panel.style.display = state.assistant.open ? "block" : "none";
    $("#pendingCount").textContent = String(state.assistant.pending||0);

    const body = $("#assistantBody");
    const chat = state.assistant.chat || [];
    
    // Command suggestions
    const suggestions = [
      {cmd: "show needs reply", desc: "Show patients needing reply"},
      {cmd: "open 107853", desc: "Open specific patient"},
      {cmd: "update patient 107853 waitingOn=Clinic", desc: "Update patient info"},
      {cmd: "export data", desc: "Download all data as Excel"},
      {cmd: "generate report", desc: "Generate 4pm report"},
      {cmd: "show charts", desc: "View analytics"},
      {cmd: "what's pending", desc: "Show pending items"},
      {cmd: "clear search", desc: "Clear all filters"},
      {cmd: "add patient", desc: "Add new patient"}
    ];
    
    const suggestionsHtml = `
      <div class="command-suggestions" id="commandSuggestions">
        ${suggestions.map(s => `
          <div class="command-chip" data-command="${s.cmd}">${s.cmd}</div>
        `).join('')}
      </div>
    `;
    
    body.innerHTML = chat.map(m => `
      <div class="bubble ${m.role}">
        ${escapeHtml(m.text)}
        ${m.meta ? `<div class="small">${escapeHtml(m.meta)}</div>` : ""}
      </div>
    `).join("") + suggestionsHtml;

    // Add event listeners to command chips
    $$(".command-chip").forEach(chip => {
      chip.addEventListener("click", () => {
        const cmd = chip.dataset.command;
        $("#assistantInput").value = cmd;
        $("#assistantSend").click();
      });
    });

    // autoscroll
    body.scrollTop = body.scrollHeight;
  }

  function addAssistant(role, text, meta){
    state.assistant.chat.push({ role, text, meta: meta||"" });
    saveState();
    renderAssistant();
  }
  
  function addAssistantSystem(text){
    addAssistant("sys", text);
  }

  function parseMatterFromText(s){
    const m = s.match(/\bM?-?\s*(\d{4,})\b/i);
    return m ? m[1] : null;
  }

  // IMPROVED: Enhanced assistant with more capabilities
  function assistantRespond(input){
    const msg = lower(input);

    // Show command help
    if(msg.includes("help") || msg === "?") {
      addAssistant("sys", "I can help you with: • show needs reply • open [matter] • update patient [matter] [field=value] • export data • generate report • show charts • what's pending • clear search • add patient • add task");
      return;
    }

    // Commands
    if(msg.includes("show needs reply") || msg==="needs reply"){
      state.ui.tab="Patients"; state.ui.patientStatus="Needs reply"; state.ui.patientWaiting="all"; state.ui.patientSearch="";
      addAssistant("sys","Showing patients/tasks that need reply.");
      render(); return;
    }

    if(msg.includes("show charts") || msg.includes("view analytics")) {
      state.ui.tab = "Charts";
      addAssistant("sys", "Opening charts and analytics.");
      render(); return;
    }

    if(msg.startsWith("open ")){
      const matter = parseMatterFromText(input) || state.assistant.lastMatter;
      if(matter){
        state.ui.tab="Patients";
        state.ui.patientSearch = matter;
        state.ui.patientStatus="all";
        state.ui.patientWaiting="all";
        state.assistant.lastMatter = matter;
        addAssistant("sys",`Opening matter ${matter} in Patients.`);
        render(); return;
      }
    }

    // "give an update about <name>" or "what's the status of <name>"
    if(msg.includes("give an update") || msg.includes("update about") || msg.includes("status of") || msg.includes("what about")){
      const name = input.split(/about|of/i)[1]?.trim();
      const p = name ? state.patients.find(x => lower(x.patient).includes(lower(name)) || x.matter === name) : null;
      if(p){
        state.assistant.lastMatter = p.matter;
        addAssistant("sys", `Patient: ${p.patient} • Matter: ${p.matter} • Type: ${p.type||""} • Provider: ${p.provider||""} • Status: ${p.status||""} • Waiting On: ${p.waitingOn||""} • Requested: ${p.requestedDate||""}\nNotes: ${p.notes||""}`);
      }else{
        addAssistant("sys", "I couldn't find that patient name in your list yet.");
      }
      return;
    }

    // "what's pending" or "what do I have pending"
    if(msg.includes("what's pending") || msg.includes("what do i have") || msg.includes("pending items")) {
      const overdueTasks = state.tasks.filter(t => t.progress === "Open").length;
      const needsReplyPatients = state.patients.filter(p => p.status === "Needs reply").length;
      addAssistant("sys", `You have: • ${overdueTasks} open tasks • ${needsReplyPatients} patients needing reply • ${state.patients.filter(p => p.waitingOn === "Clinic").length} waiting on clinic`);
      return;
    }

    // "clear search" or "clear filters"
    if(msg.includes("clear search") || msg.includes("clear filters")) {
      state.ui.patientSearch = "";
      state.ui.patientStatus = "all";
      state.ui.patientWaiting = "all";
      state.ui.taskSearch = "";
      addAssistant("sys", "Cleared all search filters.");
      render();
      return;
    }

    // "export data" or "download excel"
    if(msg.includes("export data") || msg.includes("download excel") || msg.includes("download data")) {
      downloadCSV();
      addAssistant("sys", "Downloading all patient data as Excel file.");
      return;
    }

    // "generate report" 
    if(msg.includes("generate report") || msg.includes("create report")) {
      state.ui.tab = "Reports";
      generateDraftInto("#reportText");
      addAssistant("sys", "Generated 4pm report and opened Reports tab.");
      return;
    }

    // "add patient" or "new patient"
    if(msg.includes("add patient") || msg.includes("new patient")) {
      openQuickPatient();
      addAssistant("sys", "Opening Quick Log to add a new patient.");
      return;
    }

    // "add task" or "new task"
    if(msg.includes("add task") || msg.includes("new task")) {
      openQuickTask();
      addAssistant("sys", "Opening Quick Log to add a new task.");
      return;
    }

    // Update patient by structured params
    if(msg.includes("update patient") || msg.includes("update the patient") || msg.includes("update the patient file")){
      const matter = parseMatterFromText(input) || state.assistant.lastMatter;
      if(!matter){
        addAssistant("sys","Tell me the matter number (ex: update patient 107853 waitingOn=Clinic).");
        return;
      }
      const p = state.patients.find(x => x.matter===matter);
      if(!p){
        addAssistant("sys", `I can't update matter ${matter} because it isn't in Patients yet.`);
        return;
      }

      // Natural language: "to waiting on clinic"
      if(msg.includes("waiting on clinic") || msg.includes("waiting-on clinic")){
        p.waitingOn = "Clinic";
        if(!p.status) p.status = "Sent to clinic";
        state.assistant.lastMatter = matter;
        addAssistant("sys", `Updated patient ${matter}: waitingOn → Clinic.`);
        render();
        return;
      }

      // Parse key=value pairs
      const pairs = Array.from(input.matchAll(/\b(status|waitingOn|type|provider|state|patient|sender|requestedDate)\s*=\s*([^,\n]+)/gi));
      if(pairs.length===0){
        addAssistant("sys","Tell me what to change. Example: update patient 107853 status=Needs reply waitingOn=You");
        return;
      }
      for(const [,k,v] of pairs){
        const key = k.trim();
        p[key] = norm(v);
      }
      state.assistant.lastMatter = matter;
      addAssistant("sys", `Updated patient ${matter}.`);
      render();
      return;
    }

    // fallback: if message includes a matter number, show summary
    const m = parseMatterFromText(input);
    if(m){
      const p = state.patients.find(x => x.matter===m);
      if(p){
        state.assistant.lastMatter = p.matter;
        addAssistant("sys", `Patient: ${p.patient} • Matter: ${p.matter} • Status: ${p.status||""} • Waiting On: ${p.waitingOn||""} • Provider: ${p.provider||""}\nNotes: ${p.notes||""}`);
      }else{
        addAssistant("sys", `I don't have matter ${m} saved yet. Add it via Quick Log → Patient.`);
      }
      return;
    }

    addAssistant("sys","Try: • help - show all commands • show needs reply • open 107853 • update patient 107853 • export data • generate report • what's pending");
  }

  // -----------------------------
  // CSV download (Excel-friendly) - IMPROVED to include all data
  // -----------------------------
  function downloadCSV(){
    // Create patients CSV
    const patientHeaders = ["Matter","Patient","State","Type","Provider","Provider Email","Requested Date","Sender","Status","Waiting On","Notes", "Created At"];
    const patientRows = state.patients.map(p => [
      p.matter, p.patient, p.state, p.type, p.provider, p.providerEmail, p.requestedDate, p.sender, p.status, p.waitingOn, p.notes, p.createdAt
    ]);
    
    // Create tasks CSV
    const taskHeaders = ["ID","Matter","Task Type","Priority","Progress","Description","Created At"];
    const taskRows = state.tasks.map(t => [
      t.id, t.matter, t.taskType, t.priority, t.progress, t.description, t.createdAt
    ]);
    
    // Create reports CSV
    const reportHeaders = ["ID","Date/Time","Report Text"];
    const reportRows = state.reports.map(r => [
      r.id, r.when, r.text
    ]);
    
    // Combine all into one CSV with sections
    const csvContent = [
      "MEDICAL DEPARTMENT COMMAND CENTER - FULL DATA EXPORT",
      `Exported: ${new Date().toLocaleString()}`,
      "",
      "=== PATIENTS ===",
      patientHeaders.join(","),
      ...patientRows.map(r => r.map(v => {
        const s = (v??"").toString().replace(/"/g,'""');
        return `"${s}"`;
      }).join(",")),
      "",
      "=== TASKS ===",
      taskHeaders.join(","),
      ...taskRows.map(r => r.map(v => {
        const s = (v??"").toString().replace(/"/g,'""');
        return `"${s}"`;
      }).join(",")),
      "",
      "=== SAVED REPORTS ===",
      reportHeaders.join(","),
      ...reportRows.map(r => r.map(v => {
        const s = (v??"").toString().replace(/"/g,'""');
        return `"${s}"`;
      }).join(",")),
      "",
      `Total Patients: ${state.patients.length}`,
      `Total Tasks: ${state.tasks.length}`,
      `Total Reports: ${state.reports.length}`
    ].join("\n");

    const blob = new Blob([csvContent], {type:"text/csv;charset=utf-8"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `medical-command-center-full-export-${new Date().toISOString().slice(0,10)}.csv`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=> URL.revokeObjectURL(url), 2000);
    
    toast("Data Exported", "All patient, task, and report data downloaded as CSV.");
  }

  // -----------------------------
  // Top-level buttons
  // -----------------------------
  $("#btnToggleAssistant").addEventListener("click", ()=>{
    state.assistant.open = !state.assistant.open;
    render();
  });

  $("#btnDownload").addEventListener("click", downloadCSV);

  $("#btnGenerate").addEventListener("click", ()=>{
    // Generate draft and route to Reports
    state.ui.tab = "Reports";
    state.ui.reportEditingId = null;
    state.ui.currentDraft = generateDraft();
    toast("Draft generated","Opened Reports with a new 4pm draft.");
    render();
  });

  $("#assistantSend").addEventListener("click", ()=>{
    const input = $("#assistantInput");
    const text = norm(input.value);
    if(!text) return;
    addAssistant("me", text);
    input.value = "";
    assistantRespond(text);
    
    // Keep focus on input
    setTimeout(() => input.focus(), 50);
  });

  $("#assistantInput").addEventListener("keydown", (e)=>{
    if(e.key==="Enter"){ 
      e.preventDefault(); 
      $("#assistantSend").click(); 
    }
  });
  
  // FIX: Ensure assistant input is immediately focusable
  $("#assistantInput").addEventListener("focus", (e) => {
    e.target.select();
  });

  // Initialize assistant with welcome message
  if(state.assistant.chat.length === 0) {
    addAssistant("sys", "Hello! I'm your medical command center assistant. I can help you manage patients, tasks, generate reports, and more. Try typing 'help' to see what I can do.");
  }

  // If something breaks, show it.
  window.addEventListener("error", (e)=>{
    console.error(e.error||e.message);
    toast("Script error", "Something crashed. Refresh and try again. If it persists, tell me what you clicked.");
  });

  // First render
  render();
})();
</script>
</body>
</html>
