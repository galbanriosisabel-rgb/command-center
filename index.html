<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Medical Department Command Center — Enhanced with Charts</title>
<!-- Chart.js para gráficos visuales -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  :root{
    --bg:#0b0d10; --panel:#11151b; --panel2:#0f1318; --card:#141a22;
    --text:#e7e9ee; --muted:#aab0bd; --border:#263244;
    --red:#d10f2f; --ok:#22c55e; --warn:#f59e0b; --bad:#ef4444; --link:#7dd3fc;
    --shadow:0 12px 30px rgba(0,0,0,.35);
    --r:18px; --r2:14px;
    --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono","Courier New", monospace;
    --sans: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
    --accent: linear-gradient(135deg, #d10f2f 0%, #7dd3fc 100%);
    --accent-glow: 0 0 20px rgba(209, 15, 47, 0.4);
    --transition: all 0.3s ease;
    --chart-bg: rgba(20, 26, 34, 0.9);
    --chart-colors: #d10f2f, #7dd3fc, #22c55e, #f59e0b, #a855f7, #3b82f6, #ef4444, #8b5cf6;
  }
  
  /* Animations */
  @keyframes pulse {
    0% { opacity: 1; }
    50% { opacity: 0.7; }
    100% { opacity: 1; }
  }
  
  @keyframes slideIn {
    from { transform: translateY(20px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  
  @keyframes glow {
    0% { box-shadow: 0 0 5px rgba(209, 15, 47, 0.5); }
    50% { box-shadow: 0 0 20px rgba(209, 15, 47, 0.8); }
    100% { box-shadow: 0 0 5px rgba(209, 15, 47, 0.5); }
  }
  
  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  
  @keyframes float {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(-5px); }
  }
  
  *{box-sizing:border-box}
  
  body{
    margin:0; font-family:var(--sans); color:var(--text);
    background: radial-gradient(1200px 600px at 10% 0%, rgba(209,15,47,.18), transparent 55%),
                radial-gradient(900px 600px at 95% 15%, rgba(125,211,252,.12), transparent 60%),
                linear-gradient(180deg, #07080a, #0b0d10 20%, #0b0d10);
    min-height:100vh;
    overflow-x: hidden;
  }
  
  /* Custom scrollbar */
  ::-webkit-scrollbar {
    width: 8px;
    height: 8px;
  }
  
  ::-webkit-scrollbar-track {
    background: rgba(255, 255, 255, 0.05);
    border-radius: 4px;
  }
  
  ::-webkit-scrollbar-thumb {
    background: rgba(209, 15, 47, 0.5);
    border-radius: 4px;
  }
  
  ::-webkit-scrollbar-thumb:hover {
    background: rgba(209, 15, 47, 0.8);
  }
  
  a{color:var(--link); text-decoration:none}
  
  .topbar{
    position:sticky; top:0; z-index:10;
    backdrop-filter: blur(10px);
    background: rgba(9,11,14,.85);
    border-bottom:1px solid rgba(255,255,255,.06);
    animation: slideIn 0.5s ease-out;
  }
  
  .topbar-inner{
    max-width:1200px; margin:0 auto; padding:14px 16px;
    display:flex; align-items:center; gap:12px;
  }
  
  .brand{
    display:flex; align-items:center; gap:10px; min-width:260px;
  }
  
  .dot{
    width:12px; height:12px; border-radius:50%; 
    background:var(--red); 
    box-shadow:0 0 0 6px rgba(209,15,47,.15);
    animation: pulse 2s infinite;
  }
  
  .title{
    font-weight:800; letter-spacing:.2px;
    background: var(--accent);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  
  .subtitle{color:var(--muted); font-size:13px}
  
  .tabs{display:flex; gap:8px; flex:1}
  
  .tab{
    padding:9px 12px; border-radius:999px;
    border:1px solid rgba(255,255,255,.08);
    background: rgba(255,255,255,.03);
    color:var(--text);
    cursor:pointer; user-select:none;
    transition: var(--transition);
    position: relative;
    overflow: hidden;
  }
  
  .tab:hover {
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
  }
  
  .tab.active{
    border-color: rgba(125,211,252,.25); 
    background: rgba(125,211,252,.1);
    box-shadow: inset 0 0 0 1px rgba(125,211,252,.18);
    animation: glow 3s infinite;
  }
  
  .tab::after {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
    transition: left 0.7s;
  }
  
  .tab:hover::after {
    left: 100%;
  }
  
  .actionsBar{display:flex; gap:10px; align-items:center}
  
  .btn{
    display:inline-flex; align-items:center; gap:10px;
    padding:10px 14px; border-radius:999px;
    border:1px solid rgba(255,255,255,.10);
    background: rgba(255,255,255,.03);
    color:var(--text);
    cursor:pointer;
    transition: var(--transition);
  }
  
  .btn.primary{
    border-color: rgba(209,15,47,.45);
    background: linear-gradient(180deg, rgba(209,15,47,.25), rgba(209,15,47,.12));
  }
  
  .btn:hover{
    border-color: rgba(255,255,255,.22);
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
  }
  
  .btn.primary:hover {
    animation: pulse 1s infinite;
    box-shadow: var(--accent-glow);
  }
  
  .btn svg{width:18px; height:18px; fill:currentColor; opacity:.9}
  
  .container{
    max-width:1200px; margin:0 auto; padding:18px 16px 90px;
    animation: fadeIn 0.7s ease-out;
  }
  
  .pageTitle{
    font-size:28px; font-weight:900; margin:14px 0 4px;
    position: relative;
    display: inline-block;
  }
  
  .pageTitle::after {
    content: '';
    position: absolute;
    bottom: -5px;
    left: 0;
    width: 60px;
    height: 3px;
    background: var(--accent);
    border-radius: 2px;
  }
  
  .pageHint{color:var(--muted); margin:0 0 16px}
  
  .grid2{display:grid; grid-template-columns: 1.2fr .8fr; gap:14px}
  
  .kpis{
    display:grid; 
    grid-template-columns: repeat(4, minmax(0,1fr)); 
    gap:12px; 
    margin:10px 0 14px;
  }
  
  .kpi{
    background: rgba(255,255,255,.03);
    border:1px solid rgba(255,255,255,.08);
    border-radius: var(--r);
    padding:14px 14px 12px;
    box-shadow: var(--shadow);
    transition: var(--transition);
    animation: slideIn 0.5s ease-out backwards;
  }
  
  .kpi:hover {
    transform: translateY(-5px);
    box-shadow: 0 15px 35px rgba(0,0,0,0.4);
  }
  
  .kpi .label{display:flex; align-items:center; gap:10px; color:var(--muted); font-weight:700}
  
  .pill{
    display:inline-flex; align-items:center; gap:8px; 
    padding:7px 10px; border-radius:999px;
    border:1px solid rgba(255,255,255,.10); 
    background: rgba(255,255,255,.02); 
    color:var(--text); 
    cursor:pointer;
    transition: var(--transition);
  }
  
  .pill:hover {
    background: rgba(255,255,255,.08);
    transform: scale(1.05);
  }
  
  .pill .miniDot{width:10px; height:10px; border-radius:50%;}
  
  .bigNum{
    font-size:34px; font-weight:900; margin-top:8px;
    background: var(--accent);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  
  .card{
    background: rgba(255,255,255,.03);
    border:1px solid rgba(255,255,255,.08);
    border-radius: var(--r);
    padding:14px;
    box-shadow: var(--shadow);
    transition: var(--transition);
    animation: fadeIn 0.7s ease-out backwards;
  }
  
  .card:hover {
    box-shadow: 0 15px 35px rgba(0,0,0,0.4);
    border-color: rgba(255,255,255,.12);
  }
  
  .card h3{
    margin:0 0 10px; 
    font-size:16px; 
    letter-spacing:.2px;
    color: var(--link);
  }
  
  .tools{
    display:flex; 
    flex-wrap:wrap; 
    gap:10px; 
    align-items:center; 
    margin-bottom:12px;
  }
  
  .input, select, textarea{
    width:100%;
    padding:10px 12px;
    border-radius: 14px;
    border:1px solid rgba(255,255,255,.10);
    background: rgba(0,0,0,.18);
    color: var(--text);
    outline:none;
    transition: var(--transition);
    font-family: var(--sans);
  }
  
  .input:focus, select:focus, textarea:focus {
    border-color: rgba(125,211,252,.5);
    box-shadow: 0 0 0 2px rgba(125,211,252,.2);
  }
  
  .input, select {
    cursor: text;
  }
  
  textarea{min-height:120px; resize:vertical}
  
  .tools .input, .tools select{width:auto; min-width:240px}
  .tools select{min-width:190px}
  
  .mini{color:var(--muted); font-size:12px}
  
  table{width:100%; border-collapse:separate; border-spacing:0}
  th, td{padding:10px 10px; border-bottom:1px solid rgba(255,255,255,.08); vertical-align:top}
  th{color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.12em; text-align:left}
  td{font-size:14px}
  .nowrap{white-space:nowrap}
  
  .cellSelect{
    width:100%;
    padding:8px 10px;
    border-radius: 12px;
    border:1px solid rgba(255,255,255,.10);
    background: rgba(0,0,0,.18);
    color:var(--text);
    transition: var(--transition);
    cursor: pointer;
  }
  
  .cellSelect:focus {
    border-color: rgba(125,211,252,.5);
    box-shadow: 0 0 0 2px rgba(125,211,252,.2);
  }
  
  .rowActions{white-space:nowrap}
  
  .iconBtn{
    display:inline-flex; align-items:center; justify-content:center;
    width:34px; height:34px; border-radius:12px;
    border:1px solid rgba(255,255,255,.10);
    background: rgba(255,255,255,.03);
    color: var(--text);
    cursor:pointer;
    margin-right:6px;
    transition: var(--transition);
  }
  
  .iconBtn svg{width:18px; height:18px; fill:currentColor; opacity:.92}
  .iconBtn.danger{border-color: rgba(239,68,68,.35); color: var(--bad)}
  
  .iconBtn:hover{
    border-color: rgba(255,255,255,.22);
    transform: translateY(-2px) scale(1.1);
    box-shadow: 0 5px 10px rgba(0,0,0,0.2);
  }
  
  .badge{
    display:inline-flex; align-items:center; gap:8px;
    padding:6px 10px; border-radius:999px;
    border:1px solid rgba(255,255,255,.10);
    background: rgba(255,255,255,.02);
    font-size:12px; color:var(--muted);
    transition: var(--transition);
  }
  
  .badge:hover {
    background: rgba(255,255,255,.08);
  }
  
  .badge strong{color:var(--text)}
  
  /* Chart Section Styles */
  .charts-container {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
    gap: 20px;
    margin-top: 20px;
  }
  
  .chart-card {
    background: var(--chart-bg);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: var(--r);
    padding: 18px;
    box-shadow: var(--shadow);
    transition: var(--transition);
    display: flex;
    flex-direction: column;
    height: 100%;
    min-height: 340px;
  }
  
  .chart-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 20px 40px rgba(0,0,0,0.5);
  }
  
  .chart-card h3 {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 16px;
    color: var(--text);
    min-height: 40px;
    font-size: 16px;
    padding-bottom: 8px;
    border-bottom: 1px solid rgba(255,255,255,.05);
  }
  
  .chart-placeholder {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    flex-grow: 1;
    color: var(--muted);
    text-align: center;
    padding: 30px 20px;
    border-radius: 12px;
    background: rgba(0,0,0,.08);
    border: 1px dashed rgba(255,255,255,.08);
    margin-top: 10px;
  }
  
  /* Contenedor del gráfico */
  .chart-canvas-container {
    position: relative;
    flex-grow: 1;
    margin: 0;
    padding: 0;
    background: transparent !important;
  }
  
  /* Canvas del gráfico */
  .chart-canvas {
    width: 100% !important;
    height: 220px !important;
    max-height: 220px !important;
    background: transparent !important;
  }
  
  .chart-legend {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 12px;
    padding: 8px;
    background: rgba(0,0,0,.1);
    border-radius: 8px;
    font-size: 11px;
    max-height: 80px;
    overflow-y: auto;
  }
  
  .legend-item {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 4px 6px;
    background: rgba(255,255,255,.03);
    border-radius: 6px;
    cursor: pointer;
    transition: var(--transition);
    white-space: nowrap;
  }
  
  .legend-item:hover {
    background: rgba(255,255,255,.08);
    transform: translateY(-1px);
  }
  
  .legend-color {
    width: 10px;
    height: 10px;
    border-radius: 2px;
    flex-shrink: 0;
  }
  
  .stat-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }
  
  .stat-item {
    background: rgba(255,255,255,.03);
    padding: 12px;
    border-radius: 10px;
    border-left: 3px solid;
    transition: var(--transition);
    cursor: pointer;
  }
  
  .stat-item:hover {
    background: rgba(255,255,255,.08);
    transform: translateY(-2px);
  }
  
  .stat-label {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 5px;
  }
  
  .stat-value {
    font-size: 20px;
    font-weight: 700;
  }
  
  /* Insights Section - REVISADO: eliminado el fondo negro */
  .insights-section {
    margin-top: 20px;
    margin-bottom: 20px;
  }
  
  .insights-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
    flex-wrap: wrap;
    gap: 10px;
  }
  
  .insights-stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 15px;
    margin-bottom: 20px;
  }
  
  .insight-stat {
    background: rgba(255,255,255,.03);
    padding: 15px;
    border-radius: 12px;
    border-left: 4px solid;
  }
  
  .insight-stat.green { border-left-color: #22c55e; }
  .insight-stat.blue { border-left-color: #3b82f6; }
  .insight-stat.orange { border-left-color: #f59e0b; }
  .insight-stat.purple { border-left-color: #a855f7; }
  
  .insight-label {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 5px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  
  .insight-value {
    font-size: 24px;
    font-weight: 700;
    color: var(--text);
  }
  
  .insight-subtext {
    font-size: 12px;
    color: var(--muted);
    margin-top: 5px;
  }
  
  .date-selector {
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(255,255,255,.03);
    padding: 8px 12px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,.08);
  }
  
  .date-selector label {
    font-size: 13px;
    color: var(--muted);
  }
  
  .date-selector input {
    background: rgba(0,0,0,.2);
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 8px;
    padding: 6px 10px;
    color: var(--text);
    font-family: var(--sans);
  }
  
  /* Patient Summary Card - MEJORADO para mostrar resumen en lugar de tabla */
  .patient-summary-card {
    margin-top: 20px;
  }
  
  .patient-summary-card .tools {
    margin-bottom: 16px;
  }
  
  /* Patient Summary Cards */
  .patient-summary-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 15px;
    margin-top: 15px;
  }
  
  .patient-card {
    background: rgba(255,255,255,.03);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: var(--r2);
    padding: 16px;
    transition: var(--transition);
    animation: fadeIn 0.5s ease-out;
  }
  
  .patient-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    border-color: rgba(125,211,252,.15);
  }
  
  .patient-card-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 12px;
    padding-bottom: 10px;
    border-bottom: 1px solid rgba(255,255,255,.05);
  }
  
  .patient-id {
    font-weight: 700;
    font-size: 14px;
    color: var(--link);
    letter-spacing: 0.5px;
  }
  
  .patient-name {
    font-weight: 700;
    font-size: 16px;
    color: var(--text);
    margin-bottom: 4px;
  }
  
  .patient-meta {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 8px;
  }
  
  .patient-state {
    background: rgba(209,15,47,.1);
    color: #d10f2f;
    padding: 2px 8px;
    border-radius: 10px;
    font-weight: 600;
  }
  
  .patient-details {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-top: 12px;
  }
  
  .patient-detail {
    flex: 1;
    min-width: 120px;
  }
  
  .detail-label {
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 4px;
  }
  
  .detail-value {
    font-size: 13px;
    color: var(--text);
    font-weight: 500;
  }
  
  .patient-status {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    border-radius: 12px;
    font-size: 12px;
    font-weight: 600;
  }
  
  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
  }
  
  .status-sent { background: rgba(34,197,94,.2); color: #22c55e; }
  .status-sent .status-dot { background: #22c55e; }
  
  .status-new { background: rgba(59,130,246,.2); color: #3b82f6; }
  .status-new .status-dot { background: #3b82f6; }
  
  .status-needs-reply { background: rgba(245,158,11,.2); color: #f59e0b; }
  .status-needs-reply .status-dot { background: #f59e0b; }
  
  .waiting-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    background: rgba(125,211,252,.1);
    color: #7dd3fc;
    border-radius: 12px;
    font-size: 12px;
    font-weight: 600;
  }
  
  .patient-notes {
    margin-top: 12px;
    padding-top: 10px;
    border-top: 1px solid rgba(255,255,255,.05);
    font-size: 12px;
    color: var(--muted);
    line-height: 1.5;
  }
  
  /* Modal */
  .backdrop{
    position:fixed; inset:0; background:rgba(0,0,0,.6); 
    display:none; z-index:50; align-items:center; justify-content:center; padding:20px;
    animation: fadeIn 0.3s ease-out;
  }
  
  .modal{
    width:min(920px, 95vw);
    background: rgba(15,19,24,.92);
    border:1px solid rgba(255,255,255,.10);
    border-radius: 22px;
    box-shadow: 0 30px 90px rgba(0,0,0,.6);
    overflow:hidden;
    animation: slideIn 0.4s ease-out;
  }
  
  .modalHead{
    display:flex; align-items:center; justify-content:space-between; 
    padding:14px 16px; border-bottom:1px solid rgba(255,255,255,.08)
  }
  
  .modalHead h2{margin:0; font-size:18px}
  
  .modalBody{padding:14px 16px}
  
  .modalGrid{display:grid; grid-template-columns:1fr 1fr; gap:10px}
  
  .modalFoot{
    display:flex; justify-content:space-between; gap:10px; 
    padding:14px 16px; border-top:1px solid rgba(255,255,255,.08)
  }
  
  /* Confirm Modal */
  .confirm-modal {
    width: min(500px, 90vw);
  }
  
  .confirm-actions {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 20px;
  }
  
  .confirm-text {
    font-size: 16px;
    line-height: 1.5;
    padding: 15px 0;
    text-align: center;
  }
  
  .toastWrap{
    position:fixed; right:16px; bottom:16px; 
    display:flex; flex-direction:column; gap:10px; z-index:60
  }
  
  .toast{
    background:rgba(15,19,24,.92); 
    border:1px solid rgba(255,255,255,.12); 
    border-radius:16px; 
    padding:10px 12px; 
    box-shadow: var(--shadow); 
    width: min(420px, 92vw);
    animation: slideIn 0.5s ease-out;
  }
  
  .toast .t{font-weight:800}
  .toast .m{color:var(--muted); font-size:13px; margin-top:4px}
  
  /* Assistant */
  .assistant{
    position:fixed; right:16px; bottom:16px;
    width:min(420px, 92vw);
    max-height: 70vh;
    background: rgba(15,19,24,.95);
    border:1px solid rgba(255,255,255,.12);
    border-radius: 22px;
    box-shadow: 0 30px 80px rgba(0,0,0,.55);
    overflow:hidden;
    display:none;
    z-index:70;
    animation: slideIn 0.5s ease-out;
  }
  
  .assistantHead{
    display:flex; align-items:center; justify-content:space-between; 
    padding:12px 14px; border-bottom:1px solid rgba(255,255,255,.08);
    background: rgba(20,26,34,0.8);
  }
  
  .assistantHead .name{
    display:flex; align-items:center; gap:10px; font-weight:900;
  }
  
  .assistantHead .pending{
    color:var(--muted); font-size:13px;
    animation: pulse 2s infinite;
  }
  
  .assistantBody{
    padding:12px 12px 0; overflow:auto; max-height: calc(70vh - 120px)
  }
  
  .bubble{
    border:1px solid rgba(255,255,255,.10); 
    background: rgba(255,255,255,.03); 
    border-radius: 18px; 
    padding:10px 12px; 
    margin-bottom:10px;
    animation: slideIn 0.3s ease-out;
  }
  
  .bubble.me{
    border-color: rgba(125,211,252,.18);
    background: rgba(125,211,252,.05);
    margin-left: 20px;
  }
  
  .bubble.sys{
    border-color: rgba(34,197,94,.18);
    background: rgba(34,197,94,.05);
    margin-right: 20px;
  }
  
  .bubble .small{
    color:var(--muted); font-size:12px; margin-top:6px;
  }
  
  .assistantFoot{
    padding:12px; border-top:1px solid rgba(255,255,255,.08); 
    display:flex; gap:10px;
    background: rgba(20,26,34,0.8);
  }
  
  .assistantFoot input{
    flex:1;
    cursor: text;
  }
  
  .assistantFoot input:focus {
    border-color: rgba(125,211,252,.5);
    box-shadow: 0 0 0 2px rgba(125,211,252,.2);
  }
  
  .ghostBtn{
    background:transparent; border:1px solid rgba(255,255,255,.10); 
    color:var(--text); border-radius:999px; padding:9px 12px; cursor:pointer;
    transition: var(--transition);
  }
  
  .ghostBtn:hover{
    border-color: rgba(255,255,255,.22);
    background: rgba(255,255,255,.05);
  }
  
  /* Assistant command suggestions */
  .command-suggestions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 10px;
    padding: 8px;
    background: rgba(255,255,255,.02);
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,.05);
  }
  
  .command-chip {
    padding: 6px 10px;
    background: rgba(125,211,252,.1);
    border: 1px solid rgba(125,211,252,.2);
    border-radius: 999px;
    font-size: 12px;
    cursor: pointer;
    transition: var(--transition);
  }
  
  .command-chip:hover {
    background: rgba(125,211,252,.2);
    transform: scale(1.05);
  }
  
  /* Visual effects */
  .glowing-dot {
    position: relative;
  }
  
  .glowing-dot::after {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--red);
    filter: blur(8px);
    opacity: 0.7;
    z-index: -1;
  }
  
  .floating {
    animation: float 3s ease-in-out infinite;
  }
  
  @media (max-width: 980px){
    .grid2{grid-template-columns: 1fr}
    .kpis{grid-template-columns: repeat(2, minmax(0,1fr))}
    .brand{min-width:auto}
    .tabs{display:none}
    .charts-container {
      grid-template-columns: 1fr;
    }
    .stat-grid {
      grid-template-columns: 1fr;
    }
    .insights-stats {
      grid-template-columns: 1fr;
    }
    .insights-header {
      flex-direction: column;
      align-items: flex-start;
    }
    .chart-card {
      min-height: 320px;
    }
    .chart-canvas {
      height: 200px !important;
    }
    .patient-summary-grid {
      grid-template-columns: 1fr;
    }
  }
</style>
</head>
<body>
  <div class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <div class="dot glowing-dot"></div>
        <div>
          <div class="title">Command Center</div>
          <div class="subtitle">Medical Department • Enhanced with Charts</div>
        </div>
      </div>

      <div class="tabs" id="tabs"></div>

      <div class="actionsBar">
        <button class="btn floating" id="btnToggleAssistant" title="Toggle assistant">
          <svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-7 7v4a3 3 0 0 0 3 3h1v3l3-3h3a3 3 0 0 0 3-3V9a7 7 0 0 0-7-7zm-2 9h4v2h-4v-2zm0-4h4v2h-4V7z"/></svg>
          Assistant
        </button>
        <button class="btn" id="btnDownload" title="Download CSV">
          <svg viewBox="0 0 24 24"><path d="M5 20h14v-2H5v2zM12 2v12l4-4 1.4 1.4L12 18l-5.4-5.6L8 10l4 4V2h0z"/></svg>
          Export Data
        </button>
        <button class="btn primary" id="btnGenerate" title="Generate 4pm draft">
          <svg viewBox="0 0 24 24"><path d="M19 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V7l-4-4zm-2 16H7v-2h10v2zm0-4H7v-2h10v2zm-3-7H6V6h8v2z"/></svg>
          Generate Report
        </button>
      </div>
    </div>
  </div>

  <div class="container">
    <div id="page"></div>
  </div>

  <!-- Modal -->
  <div class="backdrop" id="backdrop">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modalHead">
        <h2 id="modalTitle">Modal</h2>
        <button class="ghostBtn" id="modalClose">✕ Close</button>
      </div>
      <div class="modalBody" id="modalBody"></div>
      <div class="modalFoot">
        <div class="mini" id="modalHint"></div>
        <div style="display:flex; gap:10px">
          <button class="ghostBtn" id="modalCancel">Cancel</button>
          <button class="btn primary" id="modalSave">Save</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Confirm Modal (for delete confirmations) -->
  <div class="backdrop" id="confirmBackdrop" style="display: none;">
    <div class="modal confirm-modal" role="dialog" aria-modal="true">
      <div class="modalHead">
        <h2 id="confirmTitle">Confirm</h2>
      </div>
      <div class="modalBody">
        <div class="confirm-text" id="confirmText"></div>
        <div class="confirm-actions">
          <button class="ghostBtn" id="confirmCancel">Cancel</button>
          <button class="btn primary" id="confirmOk">OK</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Assistant -->
  <div class="assistant" id="assistant">
    <div class="assistantHead">
      <div class="name"><span class="dot" style="width:10px;height:10px;box-shadow:none"></span> Isabel's Assistant</div>
      <div class="pending"><span id="pendingCount">0</span> pending</div>
    </div>
    <div class="assistantBody" id="assistantBody">
      <!-- Command suggestions will be inserted here -->
      <div id="commandSuggestions" class="command-suggestions"></div>
    </div>
    <div class="assistantFoot">
      <input class="input" id="assistantInput" placeholder="Ask me anything: 'show pending', 'update patient', 'export data', 'generate report'"/>
      <button class="btn primary" id="assistantSend">Send</button>
    </div>
  </div>

  <div class="toastWrap" id="toasts"></div>

<script>
(() => {
  // -----------------------------
  // Icons
  // -----------------------------
  const ICON_EDIT = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zm2.92 2.33H5v-.92l9.06-9.06.92.92L5.92 19.58zM20.71 7.04a1 1 0 0 0 0-1.41L18.37 3.29a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>`;
  const ICON_TRASH = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 7h12l-1 14H7L6 7zm3-3h6l1 2H8l1-2z"/></svg>`;
  const ICON_EMAIL = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 4-8 5L4 8V6l8 5 8-5v2z"/></svg>`;
  const ICON_SAVE = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V7l-4-4zM12 19a3 3 0 1 1 0-6 3 3 0 0 1 0 6zM6 8V5h10v3H6z"/></svg>`;
  const ICON_CHART = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg>`;
  const ICON_INSIGHTS = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 6l2.29 2.29-4.88 4.88-4-4L2 16.59 3.41 18l6-6 4 4 6.3-6.29L22 12V6z"/></svg>`;

  // -----------------------------
  // Options (Dropdowns)
  // -----------------------------
  const OPTIONS = {
    patientTypes: ["MRI","PT","Chiro/PT","Chiro","Ortho","Neuro","Pain Mgmt","Other"],
    patientStatus: ["New","Sent to clinic","Stuck","Needs reply","Done"],

  // -----------------------------

  const STORAGE_KEY = "medical_command_center_data";
  
  // Datos de pacientes REALES de la segunda imagen
  const getInitialPatients = () => [

      provider: "IRX",

    },
    {

    },
    {
      matter: "107853",
      patient: "Peter Simerin",
      state: "OH",
      type: "Chiro",
      provider: "MoveDocs",
      providerEmail: "",
      requestedDate: "2025-12-29",
      sender: "Web Page",
      status: "Sent to clinic",
      waitingOn: "You",
      notes: "Athletics PT - Wright State Client speaks haitian creole",
      createdAt: new Date("2025-12-29").toISOString()
    }
  ];

  const getInitialTasks = () => [
    {
      id: "task1",
      matter: "105539",
      taskType: "Follow-up clinic",
      priority: "High",
      progress: "Open",
      description: "Follow up with NSM about MRI scheduling for Bobby Thompson",
      createdAt: new Date(Date.now() - 2*24*60*60*1000).toISOString()
    }
  ];

  const defaultState = () => ({
    ui: { 
      tab:"Home", 
      patientSearch:"", 
      patientStatus:"all", 
      patientWaiting:"all", 
      taskSearch:"", 
      reportEditingId:null,
      chartSearch: "",
      insightDate: new Date().toISOString().split('T')[0] // Fecha actual por defecto
    },
    patients: getInitialPatients(),
    tasks: getInitialTasks(),
    reports: [],
    assistant: { open:false, chat:[], lastMatter:null, pending:0 },
    charts: {} // Cache for chart instances
  });

  let state = loadState();

  // -----------------------------
  // Helpers
  // -----------------------------
  const $ = (q, root=document) => root.querySelector(q);
  const $$ = (q, root=document) => Array.from(root.querySelectorAll(q));
  const norm = (s)=> (s??"").toString().trim();
  const lower = (s)=> norm(s).toLowerCase();
  const escapeHtml = (s)=> norm(s).replace(/[&<>"']/g, c=>({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
  const buildOptions = (list, selected) => list.map(v => `<option value="${escapeHtml(v)}" ${v===selected?"selected":""}>${escapeHtml(v)}</option>`).join("");
  const nowStamp = () => new Date().toLocaleString();
  const cryptoId = () => (crypto?.randomUUID?.() || ("id_"+Math.random().toString(16).slice(2)+Date.now()));
  
  function toast(title, msg){
    const wrap = $("#toasts");
    const el = document.createElement("div");
    el.className="toast";
    el.innerHTML = `<div class="t">${escapeHtml(title)}</div><div class="m">${escapeHtml(msg)}</div>`;
    wrap.appendChild(el);
    setTimeout(()=>{ el.style.opacity="0"; el.style.transform="translateY(6px)"; }, 3400);
    setTimeout(()=> el.remove(), 4200);
  }

  function saveState(){
    try { 
      // Guardar TODO el estado correctamente
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        ui: state.ui,
        patients: state.patients,
        tasks: state.tasks,
        reports: state.reports,
        assistant: state.assistant
      })); 
    } catch(e) { 
      console.warn("Error saving state:", e); 
    }
    $("#pendingCount").textContent = String(state.assistant.pending||0);
  }
  
  function loadState(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return defaultState();
      const parsed = JSON.parse(raw);
      // merge for forward compatibility
      const loadedState = {
        ...defaultState(),
        ...parsed,
        ui: { ...defaultState().ui, ...(parsed.ui || {}) },
        patients: parsed.patients || defaultState().patients,
        tasks: parsed.tasks || defaultState().tasks,
        reports: parsed.reports || defaultState().reports,
        assistant: { ...defaultState().assistant, ...(parsed.assistant || {}) }
      };
      
      // Asegurar que los gráficos existan
      loadedState.charts = {};
      
      return loadedState;
    } catch(e){
      console.warn("Error loading state, using default:", e);
      return defaultState();
    }
  }

  // -----------------------------
  // Modal System
  // -----------------------------
  const backdrop = $("#backdrop");
  const modalTitle = $("#modalTitle");
  const modalBody = $("#modalBody");
  const modalHint = $("#modalHint");
  let modalOnSave = null;

  function openModal(title, html, hint, onSave){
    modalTitle.textContent = title;
    modalBody.innerHTML = html;
    modalHint.textContent = hint || "";
    modalOnSave = onSave || null;
    backdrop.style.display="flex";
    
    setTimeout(() => {
      const firstInput = modalBody.querySelector('input, select, textarea');
      if (firstInput) firstInput.focus();
    }, 100);
  }
  
  function closeModal(){
    backdrop.style.display="none";
    modalBody.innerHTML = "";
    modalOnSave = null;
  }
  
  $("#modalClose").addEventListener("click", closeModal);
  $("#modalCancel").addEventListener("click", closeModal);
  $("#modalSave").addEventListener("click", () => { 
    if(modalOnSave) modalOnSave(); 
    closeModal();
  });

  // -----------------------------
  // Confirmation Modal System (NEW)
  // -----------------------------
  const confirmBackdrop = $("#confirmBackdrop");
  const confirmTitle = $("#confirmTitle");
  const confirmText = $("#confirmText");
  let confirmCallback = null;

  function openConfirm(title, message, onConfirm) {
    confirmTitle.textContent = title;
    confirmText.textContent = message;
    confirmCallback = onConfirm;
    confirmBackdrop.style.display = "flex";
  }

  function closeConfirm() {
    confirmBackdrop.style.display = "none";
    confirmCallback = null;
  }

  $("#confirmCancel").addEventListener("click", closeConfirm);
  $("#confirmOk").addEventListener("click", () => {
    if (confirmCallback) {
      confirmCallback();
    }
    closeConfirm();
  });

  // -----------------------------
  // Rendering
  // -----------------------------
  const TABS = ["Home","Patients","Tasks","Charts","Reports"];

  function renderTabs(){
    const el = $("#tabs");
    el.innerHTML = TABS.map(t => `<div class="tab ${state.ui.tab===t?"active":""}" data-tab="${t}">${t}</div>`).join("");
  }

  function render(){
    renderTabs();
    renderAssistant();
    const page = $("#page");
    if(state.ui.tab==="Home") page.innerHTML = renderHome();
    if(state.ui.tab==="Patients") page.innerHTML = renderPatients();
    if(state.ui.tab==="Tasks") page.innerHTML = renderTasks();
    if(state.ui.tab==="Charts") {
      page.innerHTML = renderCharts();
      // Render charts after DOM is ready
      setTimeout(renderChartVisualizations, 100);
    }
    if(state.ui.tab==="Reports") page.innerHTML = renderReports();
    wirePage();
    saveState();
  }

  function kpi(label, value, dotColor, pillText, pillAction){
    return `
      <div class="kpi">
        <div class="label">
          <span class="miniDot" style="background:${dotColor}"></span>
          <span>${escapeHtml(label)}</span>
        </div>
        <div class="bigNum">${value}</div>
        <div style="margin-top:10px">
          <span class="pill" data-action="${pillAction||""}">
            <span class="miniDot" style="background:${dotColor}"></span>
            ${escapeHtml(pillText||"filter")}
          </span>
        </div>
      </div>
    `;
  }

  function computeHome(){
    const today = new Date().toISOString().slice(0,10);
    const overdue = state.tasks.filter(t => lower(t.progress)==="open" && t.dueDate && t.dueDate < today).length;
    const needsReply = state.patients.filter(p => lower(p.status)==="needs reply").length
                    + state.tasks.filter(t => lower(t.taskType).includes("reply") && lower(t.progress)==="open").length;
    const newToday = state.patients.filter(p => (p.createdAt||"").slice(0,10)===today).length;
    const waitingClinic = state.patients.filter(p => lower(p.waitingOn)==="clinic" && lower(p.status)!=="done").length;
    return { overdue, needsReply, newToday, waitingClinic };
  }

  function renderHome(){
    const { overdue, needsReply, newToday, waitingClinic } = computeHome();
    const priorityPatients = state.patients.slice(0, 12);
    const inbox = state.tasks.filter(t => lower(t.progress)==="open").slice(0, 12);

    return `
      <div class="pageTitle">Dashboard</div>
      <p class="pageHint">Quick view of what matters today</p>

      <div class="kpis">
        ${kpi("Overdue today", overdue, "var(--bad)", "follow-up overdue", "home_overdue")}
        ${kpi("Needs reply", needsReply, "var(--warn)", "reply today", "home_needs_reply")}
        ${kpi("New today", newToday, "var(--ok)", "created today", "home_new_today")}
        ${kpi("Waiting on clinic", waitingClinic, "var(--muted)", "no response", "home_waiting_clinic")}
      </div>

      <div class="grid2">
        <div class="card">
          <h3>📌 Priority Patients (Today)</h3>
          <div class="tools">
            <span class="badge">Tip: click a KPI tag above to filter lists.</span>
          </div>
          ${tablePatients(priorityPatients, {compact:true})}
        </div>

        <div class="card">
          <h3>📨 Action Inbox (Email → Tasks)</h3>
          ${tableTasks(inbox, {compact:true})}
        </div>
      </div>
    `;
  }

  function tablePatients(list, {compact=false, showActions=true}={}){
    if(list.length===0){
      return `<div class="mini">No patients found.</div>`;
    }
    const rows = list.map(p => {
      const matter = escapeHtml(p.matter);
      const statusSel = `<select class="cellSelect" data-action="p_update" data-field="status" data-matter="${matter}">
        ${buildOptions(OPTIONS.patientStatus, p.status||"New")}
      </select>`;
      const waitSel = `<select class="cellSelect" data-action="p_update" data-field="waitingOn" data-matter="${matter}">
        ${buildOptions(OPTIONS.waitingOn, p.waitingOn||"Clinic")}
      </select>`;
      const typeSel = `<select class="cellSelect" data-action="p_update" data-field="type" data-matter="${matter}">
        ${buildOptions(OPTIONS.patientTypes, p.type||"MRI")}
      </select>`;

      return `
        <tr>
          <td class="nowrap"><a class="link" data-action="open_patient" data-matter="${matter}">${matter}</a></td>
          <td>${escapeHtml(p.patient||"")}</td>
          <td class="nowrap">${escapeHtml(p.state||"")}</td>
          ${compact ? "" : `<td>${typeSel}</td>`}
          <td>${escapeHtml(p.provider||"")}</td>
          ${compact ? "" : `<td class="nowrap">${escapeHtml(p.requestedDate||"")}</td>`}
          ${compact ? "" : `<td>${escapeHtml(p.sender||"")}</td>`}
          <td>${statusSel}</td>
          <td>${waitSel}</td>
          ${compact ? "" : `<td style="max-width:320px">${escapeHtml(p.notes||"")}</td>`}
          ${showActions ? `<td class="rowActions">
            <button class="iconBtn" data-action="edit_patient" data-matter="${matter}" title="Edit">${ICON_EDIT}</button>
            <button class="iconBtn danger" data-action="del_patient" data-matter="${matter}" title="Delete">${ICON_TRASH}</button>
          </td>` : ''}
        </tr>
      `;
    }).join("");

    const head = `
      <tr>
        <th>Matter</th><th>Patient</th><th>State</th>
        ${compact ? "" : "<th>Type</th>"}
        <th>Provider</th>
        ${compact ? "" : "<th>Requested</th><th>Sender</th>"}
        <th>Status</th><th>Waiting On</th>
        ${compact ? "" : "<th>Notes</th>"}
        ${showActions ? "<th></th>" : ""}
      </tr>
    `;

    return `
      <div style="overflow:auto">
        <table>
          <thead>${head}</thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    `;
  }

  function renderPatients(){
    return `
      <div class="pageTitle">Patients</div>

  function filteredPatients(){
    const q = lower(state.ui.patientSearch);
    const status = state.ui.patientStatus;
    const waiting = state.ui.patientWaiting;

    return state.patients
      .filter(p => {
        const hay = lower([p.matter,p.patient,p.state,p.type,p.provider,p.requestedDate,p.sender,p.status,p.waitingOn,p.notes].join(" "));
        if(q && !hay.includes(q)) return false;
        if(status && status!=="all" && norm(p.status)!==status) return false;
        if(waiting && waiting!=="all" && norm(p.waitingOn)!==waiting) return false;
        return true;
      });
  }

  // Función para calcular datos de los gráficos
  function calculateChartData() {
    const statusCounts = {};
    const waitingCounts = {};
    const typeCounts = {};
    
    // Initialize counts
    OPTIONS.patientStatus.forEach(s => statusCounts[s] = 0);
    OPTIONS.waitingOn.forEach(w => waitingCounts[w] = 0);
    OPTIONS.patientTypes.forEach(t => typeCounts[t] = 0);
    
    // Count actual data
    state.patients.forEach(p => {
      if(p.status) statusCounts[p.status] = (statusCounts[p.status] || 0) + 1;
      if(p.waitingOn) waitingCounts[p.waitingOn] = (waitingCounts[p.waitingOn] || 0) + 1;
      if(p.type) typeCounts[p.type] = (typeCounts[p.type] || 0) + 1;
    });
    
    // Filter out zero values for charts
    const filteredStatusCounts = Object.entries(statusCounts).filter(([_, count]) => count > 0);
    const filteredWaitingCounts = Object.entries(waitingCounts).filter(([_, count]) => count > 0);
    const filteredTypeCounts = Object.entries(typeCounts).filter(([_, count]) => count > 0);
    
    return {
      statusData: {
        labels: filteredStatusCounts.map(([label]) => label),
        data: filteredStatusCounts.map(([_, count]) => count),
        total: state.patients.length
      },
      waitingData: {
        labels: filteredWaitingCounts.map(([label]) => label),
        data: filteredWaitingCounts.map(([_, count]) => count),
        total: state.patients.length
      },
      typeData: {
        labels: filteredTypeCounts.map(([label]) => label),
        data: filteredTypeCounts.map(([_, count]) => count),
        total: state.patients.length
      }
    };
  }

  // Función para calcular insights - REVISADO: eliminado fondo negro
  function calculateInsights(selectedDate) {
    // Calcular estadísticas
    const totalPatients = state.patients.length;
    const totalTasks = state.tasks.length;
    const totalReports = state.reports.length;
    
    // Encontrar el estado más común
    const statusCounts = {};
    state.patients.forEach(p => {
      statusCounts[p.status] = (statusCounts[p.status] || 0) + 1;
    });
    const mostCommonStatus = Object.entries(statusCounts)
      .sort((a, b) => b[1] - a[1])[0] || ["None", 0];
    
    // Encontrar el tipo más común
    const typeCounts = {};
    state.patients.forEach(p => {
      typeCounts[p.type] = (typeCounts[p.type] || 0) + 1;
    });
    const mostCommonType = Object.entries(typeCounts)
      .sort((a, b) => b[1] - a[1])[0] || ["None", 0];
    
    // Calcular pacientes por estado
    const sentToClinic = state.patients.filter(p => p.status === "Sent to clinic").length;
    const needsReply = state.patients.filter(p => p.status === "Needs reply").length;
    const newPatients = state.patients.filter(p => p.status === "New").length;
    
    // Calcular tareas pendientes
    const openTasks = state.tasks.filter(t => t.progress === "Open").length;
    const highPriorityTasks = state.tasks.filter(t => t.priority === "High" && t.progress === "Open").length;
    
    return {
      totalPatients,
      totalTasks,
      totalReports,
      mostCommonStatus: {
        name: mostCommonStatus[0],
        count: mostCommonStatus[1],
        percentage: Math.round((mostCommonStatus[1] / totalPatients) * 100)
      },
      mostCommonType: {
        name: mostCommonType[0],
        count: mostCommonType[1],
        percentage: Math.round((mostCommonType[1] / totalPatients) * 100)
      },
      sentToClinic,
      needsReply,
      newPatients,
      openTasks,
      highPriorityTasks
    };
  }

  // Función para renderizar los gráficos con Chart.js
  function renderChartVisualizations() {
    const chartData = calculateChartData();
    const colors = ["#d10f2f", "#7dd3fc", "#22c55e", "#f59e0b", "#a855f7", "#3b82f6", "#ef4444", "#8b5cf6"];
    
    // Destroy existing charts
    if (state.charts.statusChart) state.charts.statusChart.destroy();
    if (state.charts.waitingChart) state.charts.waitingChart.destroy();
    if (state.charts.typeChart) state.charts.typeChart.destroy();
    
    // Configuración común para todos los gráficos
    const commonOptions = {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: {
          display: false
        },
        tooltip: {
          backgroundColor: 'rgba(20, 26, 34, 0.95)',
          titleColor: '#e7e9ee',
          bodyColor: '#aab0bd',
          borderColor: 'rgba(255,255,255,0.1)',
          borderWidth: 1,
          callbacks: {
            label: function(context) {
              const label = context.label || '';
              const value = context.raw || 0;
              const total = context.dataset.data.reduce((a, b) => a + b, 0);
              const percentage = Math.round((value / total) * 100);
              return `${label}: ${value} patients (${percentage}%)`;
            }
          }
        }
      }
    };
    
    // Render Status Chart (Doughnut)
    if (chartData.statusData.labels.length > 0) {
      const statusCtx = document.getElementById('chartStatus')?.getContext('2d');
      if (statusCtx) {
        state.charts.statusChart = new Chart(statusCtx, {
          type: 'doughnut',
          data: {
            labels: chartData.statusData.labels,
            datasets: [{
              data: chartData.statusData.data,
              backgroundColor: chartData.statusData.labels.map((_, i) => colors[i % colors.length]),
              borderColor: 'rgba(255,255,255,0.15)',
              borderWidth: 1,
              hoverOffset: 10
            }]
          },
          options: {
            ...commonOptions,
            cutout: '65%',
            animation: {
              animateScale: true,
              animateRotate: true
            }
          }
        });
      }
    }
    
    // Render Waiting Chart (Bar)
    if (chartData.waitingData.labels.length > 0) {
      const waitingCtx = document.getElementById('chartWaiting')?.getContext('2d');
      if (waitingCtx) {
        state.charts.waitingChart = new Chart(waitingCtx, {
          type: 'bar',
          data: {
            labels: chartData.waitingData.labels,
            datasets: [{
              label: 'Patients',
              data: chartData.waitingData.data,
              backgroundColor: chartData.waitingData.labels.map((_, i) => colors[(i+2) % colors.length]),
              borderColor: 'rgba(255,255,255,0.2)',
              borderWidth: 1,
              borderRadius: 4
            }]
          },
          options: {
            ...commonOptions,
            scales: {
              y: {
                beginAtZero: true,
                grid: {
                  color: 'rgba(255,255,255,0.05)'
                },
                ticks: {
                  color: 'rgba(255,255,255,0.6)',
                  font: {
                    size: 11
                  }
                }
              },
              x: {
                grid: {
                  color: 'rgba(255,255,255,0.05)'
                },
                ticks: {
                  color: 'rgba(255,255,255,0.6)',
                  font: {
                    size: 11
                  }
                }
              }
            },
            animation: {
              duration: 1000,
              easing: 'easeOutQuart'
            }
          }
        });
      }
    }
    
    // Render Type Chart (Pie)
    if (chartData.typeData.labels.length > 0) {
      const typeCtx = document.getElementById('chartTypes')?.getContext('2d');

          },
          options: {
            ...commonOptions,
            animation: {
              animateScale: true,
              animateRotate: true
            }
          }
        });
      }
    }

        state.ui.tab="Patients";

        state.ui.patientStatus="all";
        state.ui.patientWaiting="all";

      if(action==="del_patient"){ 
        const matter = actEl.dataset.matter;
        const patient = state.patients.find(p => p.matter === matter);
        const patientName = patient ? patient.patient : matter;
        
        // Use the new confirmation modal instead of native confirm
        openConfirm(
          "Delete Patient", 
          `Are you sure you want to delete patient ${patientName} (Matter: ${matter})?`,
          () => {
            deletePatient(matter);
          }
        );
        return; 
      }
      if(action==="edit_task"){ editTask(actEl.dataset.id); return; }
      if(action==="del_task"){ 
        const taskId = actEl.dataset.id;
        const task = state.tasks.find(t => t.id === taskId);
        const matterInfo = task ? `for Matter ${task.matter}` : "";
        
        // Use the new confirmation modal instead of native confirm
        openConfirm(
          "Delete Task", 
          `Are you sure you want to delete this task ${matterInfo}?`,
          () => {
            deleteTask(taskId);
          }
        );
        return; 
      }
      if(action==="edit_report"){ state.ui.tab="Reports"; state.ui.reportEditingId = actEl.dataset.id; render(); return; }
      if(action==="del_report"){ 
        const reportId = actEl.dataset.id;
        const report = state.reports.find(r => r.id === reportId);
        const reportDate = report ? report.when : "this report";
        
        // Use the new confirmation modal instead of native confirm
        openConfirm(
          "Delete Report", 
          `Are you sure you want to delete the report saved on ${reportDate}?`,
          () => {
            deleteReport(reportId);
          }
        );
        return; 
      }
    });

    $("#page").addEventListener("change", (e)=>{
      const sel = e.target.closest("[data-action='p_update'], [data-action='t_update']");
      if(!sel) return;

      if(sel.dataset.action==="p_update"){
        const matter = sel.dataset.matter;
        const field = sel.dataset.field;
        updatePatientField(matter, field, sel.value);
      }
      if(sel.dataset.action==="t_update"){
        const id = sel.dataset.id;
        const field = sel.dataset.field;
        updateTaskField(id, field, sel.value);
      }
    });
  }

  // -----------------------------
  // Reports

  function generateDraft(){
    const openTasks = state.tasks.filter(t => lower(t.progress)==="open");
    const needsReply = state.patients.filter(p => lower(p.status)==="needs reply");
    const waitingClinic = state.patients.filter(p => lower(p.waitingOn)==="clinic" && lower(p.status)!=="done");

    const lines = [];
    lines.push(`4pm Report — ${nowStamp()}`);
    lines.push("");
    lines.push(`Patients waiting on clinic: ${waitingClinic.length}`);
    for(const p of waitingClinic.slice(0,12)){
      lines.push(`- ${p.matter}: ${p.patient} • ${p.type||""} • Provider: ${p.provider||""} • Status: ${p.status||""} • Notes: ${p.notes||""}`.trim());
    }
    lines.push("");
    lines.push(`Needs reply: ${needsReply.length}`);
    for(const p of needsReply.slice(0,12)){
      lines.push(`- ${p.matter}: ${p.patient} • Provider: ${p.provider||""} • Notes: ${p.notes||""}`.trim());
    }
    lines.push("");
    lines.push(`Open tasks: ${openTasks.length}`);
    for(const t of openTasks.slice(0,18)){
      lines.push(`- ${t.matter}: [${t.priority}] ${t.taskType} — ${t.description}`.trim());
    }
    lines.push("");
    lines.push("End.");
    return lines.join("\n");
  }

  function generateDraftInto(selector){
    const draft = generateDraft();
    const ta = $(selector);
    if(ta) ta.value = draft;
    state.ui.currentDraft = draft;
    state.ui.reportEditingId = null;
    toast("Draft generated","4pm draft was generated from current Patients + Tasks.");
    render();
  }

  function saveReportFromTextarea(){
    const ta = $("#reportText");
    if(!ta) return;
    const text = norm(ta.value);
    if(!text){ 
      openConfirm("Nothing to save", "Generate or type a report first.", () => {});
      return; 
    }

    if(state.ui.reportEditingId){
      const r = state.reports.find(x => x.id===state.ui.reportEditingId);
      if(r) r.text = text;
      toast("Saved","Updated existing saved report.");

      state.reports.unshift({ id: cryptoId(), when: nowStamp(), text });
      toast("Saved","Report saved to log.");
    }
    state.ui.reportEditingId = null;
    state.ui.currentDraft = text;
    render();
  }

  // -----------------------------
  // Assistant
  // -----------------------------
  function renderAssistant(){
    const panel = $("#assistant");
    panel.style.display = state.assistant.open ? "block" : "none";
    $("#pendingCount").textContent = String(state.assistant.pending||0);

    const body = $("#assistantBody");
    const chat = state.assistant.chat || [];
    
    const suggestions = [
      {cmd: "show needs reply", desc: "Show patients needing reply"},
      {cmd: "open 107853", desc: "Open specific patient"},
      {cmd: "update patient 107853 waitingOn=Clinic", desc: "Update patient info"},
      {cmd: "export data", desc: "Download all data as Excel"},
      {cmd: "generate report", desc: "Generate 4pm report"},
      {cmd: "show charts", desc: "View analytics"},
      {cmd: "what's pending", desc: "Show pending items"},
      {cmd: "clear search", desc: "Clear all filters"},
      {cmd: "add patient", desc: "Add new patient"}
    ];
    
    const suggestionsHtml = `
      <div class="command-suggestions" id="commandSuggestions">
        ${suggestions.map(s => `
          <div class="command-chip" data-command="${s.cmd}">${s.cmd}</div>
        `).join('')}
      </div>
    `;
    
    body.innerHTML = chat.map(m => `
      <div class="bubble ${m.role}">
        ${escapeHtml(m.text)}
        ${m.meta ? `<div class="small">${escapeHtml(m.meta)}</div>` : ""}
      </div>
    `).join("") + suggestionsHtml;

    $$(".command-chip").forEach(chip => {
      chip.addEventListener("click", () => {
        const cmd = chip.dataset.command;
        $("#assistantInput").value = cmd;
        $("#assistantSend").click();
      });
    });

    body.scrollTop = body.scrollHeight;
  }

  function addAssistant(role, text, meta){
    state.assistant.chat.push({ role, text, meta: meta||"" });
    saveState();
    renderAssistant();
  }
  
  function addAssistantSystem(text){
    addAssistant("sys", text);
  }

  function parseMatterFromText(s){
    const m = s.match(/\bM?-?\s*(\d{4,})\b/i);
    return m ? m[1] : null;
  }

  function assistantRespond(input){
    const msg = lower(input);

    if(msg.includes("help") || msg === "?") {
      addAssistant("sys", "I can help you with: • show needs reply • open [matter] • update patient [matter] [field=value] • export data • generate report • show charts • what's pending • clear search • add patient • add task");
      return;
    }

    if(msg.includes("show needs reply") || msg==="needs reply"){
      state.ui.tab="Patients"; state.ui.patientStatus="Needs reply"; state.ui.patientWaiting="all"; state.ui.patientSearch="";
      addAssistant("sys","Showing patients/tasks that need reply.");
      render(); return;
    }

    if(msg.includes("show charts") || msg.includes("view analytics")) {
      state.ui.tab = "Charts";
      addAssistant("sys", "Opening charts and analytics.");
      render(); return;
    }

    if(msg.startsWith("open ")){
      const matter = parseMatterFromText(input) || state.assistant.lastMatter;
      if(matter){
        state.ui.tab="Patients";
        state.ui.patientSearch = matter;
        state.ui.patientStatus="all";
        state.ui.patientWaiting="all";
        state.assistant.lastMatter = matter;
        addAssistant("sys",`Opening matter ${matter} in Patients.`);
        render(); return;
      }
    }

    if(msg.includes("give an update") || msg.includes("update about") || msg.includes("status of") || msg.includes("what about")){
      const name = input.split(/about|of/i)[1]?.trim();
      const p = name ? state.patients.find(x => lower(x.patient).includes(lower(name)) || x.matter === name) : null;
      if(p){
        state.assistant.lastMatter = p.matter;
        addAssistant("sys", `Patient: ${p.patient} • Matter: ${p.matter} • Type: ${p.type||""} • Provider: ${p.provider||""} • Status: ${p.status||""} • Waiting On: ${p.waitingOn||""} • Requested: ${p.requestedDate||""}\nNotes: ${p.notes||""}`);
      }else{
        addAssistant("sys", "I couldn't find that patient name in your list yet.");
      }
      return;
    }

    if(msg.includes("what's pending") || msg.includes("what do i have") || msg.includes("pending items")) {
      const overdueTasks = state.tasks.filter(t => t.progress === "Open").length;
      const needsReplyPatients = state.patients.filter(p => p.status === "Needs reply").length;
      addAssistant("sys", `You have: • ${overdueTasks} open tasks • ${needsReplyPatients} patients needing reply • ${state.patients.filter(p => p.waitingOn === "Clinic").length} waiting on clinic`);
      return;
    }

    if(msg.includes("clear search") || msg.includes("clear filters")) {
      state.ui.patientSearch = "";
      state.ui.patientStatus = "all";
      state.ui.patientWaiting = "all";
      state.ui.taskSearch = "";
      state.ui.chartSearch = "";
      addAssistant("sys", "Cleared all search filters.");
      render();
      return;
    }

    if(msg.includes("export data") || msg.includes("download excel") || msg.includes("download data")) {
      downloadCSV();
      addAssistant("sys", "Downloading all patient data as Excel file.");
      return;
    }

    if(msg.includes("generate report") || msg.includes("create report")) {
      state.ui.tab = "Reports";
      generateDraftInto("#reportText");
      addAssistant("sys", "Generated 4pm report and opened Reports tab.");
      return;
    }

    if(msg.includes("add patient") || msg.includes("new patient")) {
      openQuickPatient();
      addAssistant("sys", "Opening Quick Log to add a new patient.");
      return;
    }

    if(msg.includes("add task") || msg.includes("new task")) {
      openQuickTask();
      addAssistant("sys", "Opening Quick Log to add a new task.");
      return;
    }

    if(msg.includes("update patient") || msg.includes("update the patient") || msg.includes("update the patient file")){
      const matter = parseMatterFromText(input) || state.assistant.lastMatter;
      if(!matter){
        addAssistant("sys","Tell me the matter number (ex: update patient 107853 waitingOn=Clinic).");
        return;
      }
      const p = state.patients.find(x => x.matter===matter);
      if(!p){
        addAssistant("sys", `I can't update matter ${matter} because it isn't in Patients yet.`);
        return;
      }

      if(msg.includes("waiting on clinic") || msg.includes("waiting-on clinic")){
        p.waitingOn = "Clinic";
        if(!p.status) p.status = "Sent to clinic";
        state.assistant.lastMatter = matter;
        addAssistant("sys", `Updated patient ${matter}: waitingOn → Clinic.`);
        render();
        return;
      }

      const pairs = Array.from(input.matchAll(/\b(status|waitingOn|type|provider|state|patient|sender|requestedDate)\s*=\s*([^,\n]+)/gi));
      if(pairs.length===0){
        addAssistant("sys","Tell me what to change. Example: update patient 107853 status=Needs reply waitingOn=You");
        return;
      }
      for(const [,k,v] of pairs){
        const key = k.trim();
        p[key] = norm(v);
      }
      state.assistant.lastMatter = matter;
      addAssistant("sys", `Updated patient ${matter}.`);
      render();
      return;
    }

    const m = parseMatterFromText(input);
    if(m){
      const p = state.patients.find(x => x.matter===m);
      if(p){
        state.assistant.lastMatter = p.matter;
        addAssistant("sys", `Patient: ${p.patient} • Matter: ${p.matter} • Status: ${p.status||""} • Waiting On: ${p.waitingOn||""} • Provider: ${p.provider||""}\nNotes: ${p.notes||""}`);
      }else{
        addAssistant("sys", `I don't have matter ${m} saved yet. Add it via Quick Log → Patient.`);
      }
      return;
    }

    addAssistant("sys","Try: • help - show all commands • show needs reply • open 107853 • update patient 107853 • export data • generate report • what's pending");
  }

  // -----------------------------
  // CSV download
  // -----------------------------
  function downloadCSV(){
    const patientHeaders = ["Matter","Patient","State","Type","Provider","Provider Email","Requested Date","Sender","Status","Waiting On","Notes", "Created At"];
    const patientRows = state.patients.map(p => [
      p.matter, p.patient, p.state, p.type, p.provider, p.providerEmail, p.requestedDate, p.sender, p.status, p.waitingOn, p.notes, p.createdAt
    ]);
    
    const taskHeaders = ["ID","Matter","Task Type","Priority","Progress","Description","Created At"];
    const taskRows = state.tasks.map(t => [
      t.id, t.matter, t.taskType, t.priority, t.progress, t.description, t.createdAt
    ]);
    
    const reportHeaders = ["ID","Date/Time","Report Text"];
    const reportRows = state.reports.map(r => [
      r.id, r.when, r.text
    ]);
    
    const csvContent = [
      "MEDICAL DEPARTMENT COMMAND CENTER - FULL DATA EXPORT",
      `Exported: ${new Date().toLocaleString()}`,
      "",
      "=== PATIENTS ===",
      patientHeaders.join(","),
      ...patientRows.map(r => r.map(v => {
        const s = (v??"").toString().replace(/"/g,'""');
        return `"${s}"`;
      }).join(",")),
      "",
      "=== TASKS ===",
      taskHeaders.join(","),
      ...taskRows.map(r => r.map(v => {
        const s = (v??"").toString().replace(/"/g,'""');
        return `"${s}"`;
      }).join(",")),
      "",
      "=== SAVED REPORTS ===",
      reportHeaders.join(","),
      ...reportRows.map(r => r.map(v => {
        const s = (v??"").toString().replace(/"/g,'""');
        return `"${s}"`;
      }).join(",")),
      "",
      `Total Patients: ${state.patients.length}`,
      `Total Tasks: ${state.tasks.length}`,
      `Total Reports: ${state.reports.length}`
    ].join("\n");

    const blob = new Blob([csvContent], {type:"text/csv;charset=utf-8"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `medical-command-center-full-export-${new Date().toISOString().slice(0,10)}.csv`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=> URL.revokeObjectURL(url), 2000);
    
    toast("Data Exported", "All patient, task, and report data downloaded as CSV.");
  }

  // -----------------------------
  // Top-level buttons
  // -----------------------------
  $("#btnToggleAssistant").addEventListener("click", ()=>{
    state.assistant.open = !state.assistant.open;
    render();
  });

  $("#btnDownload").addEventListener("click", downloadCSV);

  $("#btnGenerate").addEventListener("click", ()=>{
    state.ui.tab = "Reports";
    state.ui.reportEditingId = null;
    state.ui.currentDraft = generateDraft();
    toast("Draft generated","Opened Reports with a new 4pm draft.");
    render();
  });

  $("#assistantSend").addEventListener("click", ()=>{
    const input = $("#assistantInput");
    const text = norm(input.value);
    if(!text) return;
    addAssistant("me", text);
    input.value = "";
    assistantRespond(text);
    
    setTimeout(() => input.focus(), 50);
  });

  $("#assistantInput").addEventListener("keydown", (e)=>{
    if(e.key==="Enter"){ 
      e.preventDefault(); 
      $("#assistantSend").click(); 
    }
  });

  // Initialize assistant
  if(state.assistant.chat.length === 0) {
    addAssistant("sys", "Hello! I'm your medical command center assistant. I can help you manage patients, tasks, generate reports, and more. Try typing 'help' to see what I can do.");
  }

  // Initialize charts cache
  state.charts = state.charts || {};

  // Error handling
  window.addEventListener("error", (e)=>{
    console.error(e.error||e.message);
    toast("Script error", "Something crashed. Refresh and try again. If it persists, tell me what you clicked.");
  });

  // First render
  render();
})();
</script>
</body>
</html>
