<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Medical Department Command Center — Enhanced with Charts</title>
<!-- Chart.js para gráficos visuales -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  :root{
    --bg:#0b0d10; --panel:#11151b; --panel2:#0f1318; --card:#141a22;
    --text:#e7e9ee; --muted:#aab0bd; --border:#263244;
    --red:#d10f2f; --ok:#22c55e; --warn:#f59e0b; --bad:#ef4444; --link:#7dd3fc;
    --shadow:0 12px 30px rgba(0,0,0,.35);
    --r:18px; --r2:14px;
    --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono","Courier New", monospace;
    --sans: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
    --accent: linear-gradient(135deg, #d10f2f 0%, #7dd3fc 100%);
    --accent-glow: 0 0 20px rgba(209, 15, 47, 0.4);
    --transition: all 0.3s ease;
    --chart-bg: rgba(20, 26, 34, 0.9);
    --chart-colors: #d10f2f, #7dd3fc, #22c55e, #f59e0b, #a855f7, #3b82f6, #ef4444, #8b5cf6;
  }
  
  /* Animations */
  @keyframes pulse {
    0% { opacity: 1; }
    50% { opacity: 0.7; }
    100% { opacity: 1; }
  }
  
  @keyframes slideIn {
    from { transform: translateY(20px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  
  @keyframes glow {
    0% { box-shadow: 0 0 5px rgba(209, 15, 47, 0.5); }
    50% { box-shadow: 0 0 20px rgba(209, 15, 47, 0.8); }
    100% { box-shadow: 0 0 5px rgba(209, 15, 47, 0.5); }
  }
  
  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  
  @keyframes float {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(-5px); }
  }
  
  *{box-sizing:border-box}
  
  body{
    margin:0; font-family:var(--sans); color:var(--text);
    background: radial-gradient(1200px 600px at 10% 0%, rgba(209,15,47,.18), transparent 55%),
                radial-gradient(900px 600px at 95% 15%, rgba(125,211,252,.12), transparent 60%),
                linear-gradient(180deg, #07080a, #0b0d10 20%, #0b0d10);
    min-height:100vh;
    overflow-x: hidden;
  }
  
  /* Custom scrollbar */
  ::-webkit-scrollbar {
    width: 8px;
    height: 8px;
  }
  
  ::-webkit-scrollbar-track {
    background: rgba(255, 255, 255, 0.05);
    border-radius: 4px;
  }
  
  ::-webkit-scrollbar-thumb {
    background: rgba(209, 15, 47, 0.5);
    border-radius: 4px;
  }
  
  ::-webkit-scrollbar-thumb:hover {
    background: rgba(209, 15, 47, 0.8);
  }
  
  a{color:var(--link); text-decoration:none}
  
  .topbar{
    position:sticky; top:0; z-index:10;
    backdrop-filter: blur(10px);
    background: rgba(9,11,14,.85);
    border-bottom:1px solid rgba(255,255,255,.06);
    animation: slideIn 0.5s ease-out;
  }
  
  .topbar-inner{
    max-width:1200px; margin:0 auto; padding:14px 16px;
    display:flex; align-items:center; gap:12px;
  }
  
  .brand{
    display:flex; align-items:center; gap:10px; min-width:260px;
  }
  
  .dot{
    width:12px; height:12px; border-radius:50%; 
    background:var(--red); 
    box-shadow:0 0 0 6px rgba(209,15,47,.15);
    animation: pulse 2s infinite;
  }
  
  .title{
    font-weight:800; letter-spacing:.2px;
    background: var(--accent);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  
  .subtitle{color:var(--muted); font-size:13px}
  
  .tabs{display:flex; gap:8px; flex:1}
  
  .tab{
    padding:9px 12px; border-radius:999px;
    border:1px solid rgba(255,255,255,.08);
    background: rgba(255,255,255,.03);
    color:var(--text);
    cursor:pointer; user-select:none;
    transition: var(--transition);
    position: relative;
    overflow: hidden;
  }
  
  .tab:hover {
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
  }
  
  .tab.active{
    border-color: rgba(125,211,252,.25); 
    background: rgba(125,211,252,.1);
    box-shadow: inset 0 0 0 1px rgba(125,211,252,.18);
    animation: glow 3s infinite;
  }
  
  .tab::after {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
    transition: left 0.7s;
  }
  
  .tab:hover::after {
    left: 100%;
  }
  
  .actionsBar{display:flex; gap:10px; align-items:center}

  /* Dropdown menu (MedHub-style) */
  .menuWrap{position:relative; display:inline-flex; align-items:center;}
  .menuBtn{display:inline-flex; align-items:center; gap:8px;}
  .menuPanel{
    position:absolute; top:calc(100% + 10px); right:0;
    min-width: 200px;
    background: rgba(15,19,24,.98);
    border:1px solid rgba(255,255,255,.12);
    border-radius: 16px;
    box-shadow: 0 20px 60px rgba(0,0,0,.55);
    padding: 8px;
    display:none;
    z-index: 30;
  }
  .menuPanel.open{display:block;}
  .menuItem{
    display:flex; align-items:center; justify-content:space-between;
    gap:10px;
    padding:10px 12px;
    border-radius: 12px;
    cursor:pointer;
    color: var(--text);
    border:1px solid transparent;
    transition: var(--transition);
    font-weight: 700;
  }
  .menuItem:hover{
    background: rgba(255,255,255,.05);
    border-color: rgba(255,255,255,.10);
    transform: translateY(-1px);
  }
  .menuItem.active{
    background: rgba(125,211,252,.10);
    border-color: rgba(125,211,252,.25);
  }
  .menuKicker{color:var(--muted); font-size:12px; font-weight:700; padding:8px 10px 4px;}

  
  .btn{
    display:inline-flex; align-items:center; gap:10px;
    padding:10px 14px; border-radius:999px;
    border:1px solid rgba(255,255,255,.10);
    background: rgba(255,255,255,.03);
    color:var(--text);
    cursor:pointer;
    transition: var(--transition);
  }
  
  .btn.primary{
    border-color: rgba(209,15,47,.45);
    background: linear-gradient(180deg, rgba(209,15,47,.25), rgba(209,15,47,.12));
  }
  
  .btn:hover{
    border-color: rgba(255,255,255,.22);
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
  }
  
  .btn.primary:hover {
    animation: pulse 1s infinite;
    box-shadow: var(--accent-glow);
  }
  
  .btn svg{width:18px; height:18px; fill:currentColor; opacity:.9}
  
  .container{
    max-width:1200px; margin:0 auto; padding:18px 16px 90px;
    animation: fadeIn 0.7s ease-out;
  }
  
  .pageTitle{
    font-size:28px; font-weight:900; margin:14px 0 4px;
    position: relative;
    display: inline-block;
  }
  
  .pageTitle::after {
    content: '';
    position: absolute;
    bottom: -5px;
    left: 0;
    width: 60px;
    height: 3px;
    background: var(--accent);
    border-radius: 2px;
  }
  
  .pageHint{color:var(--muted); margin:0 0 16px}
  
  .grid2{display:grid; grid-template-columns: 1.2fr .8fr; gap:14px}
  
  .kpis{
    display:grid; 
    grid-template-columns: repeat(4, minmax(0,1fr)); 
    gap:12px; 
    margin:10px 0 14px;
  }
  
  .kpi{
    background: rgba(255,255,255,.03);
    border:1px solid rgba(255,255,255,.08);
    border-radius: var(--r);
    padding:14px 14px 12px;
    box-shadow: var(--shadow);
    transition: var(--transition);
    animation: slideIn 0.5s ease-out backwards;
  }
  
  .kpi:hover {
    transform: translateY(-5px);
    box-shadow: 0 15px 35px rgba(0,0,0,0.4);
  }
  
  .kpi .label{display:flex; align-items:center; gap:10px; color:var(--muted); font-weight:700}
  
  .pill{
    display:inline-flex; align-items:center; gap:8px; 
    padding:7px 10px; border-radius:999px;
    border:1px solid rgba(255,255,255,.10); 
    background: rgba(255,255,255,.02); 
    color:var(--text); 
    cursor:pointer;
    transition: var(--transition);
  }
  
  .pill:hover {
    background: rgba(255,255,255,.08);
    transform: scale(1.05);
  }
  
  .pill .miniDot{width:10px; height:10px; border-radius:50%;}
  
  .bigNum{
    font-size:34px; font-weight:900; margin-top:8px;
    background: var(--accent);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  
  .card{
    background: rgba(255,255,255,.03);
    border:1px solid rgba(255,255,255,.08);
    border-radius: var(--r);
    padding:14px;
    box-shadow: var(--shadow);
    transition: var(--transition);
    animation: fadeIn 0.7s ease-out backwards;
  }
  
  .card:hover {
    box-shadow: 0 15px 35px rgba(0,0,0,0.4);
    border-color: rgba(255,255,255,.12);
  }
  
  .card h3{
    margin:0 0 10px; 
    font-size:16px; 
    letter-spacing:.2px;
    color: var(--link);
  }
  
  .tools{
    display:flex; 
    flex-wrap:wrap; 
    gap:10px; 
    align-items:center; 
    margin-bottom:12px;
  }
  
  .input, select, textarea{
    width:100%;
    padding:10px 12px;
    border-radius: 14px;
    border:1px solid rgba(255,255,255,.10);
    background: rgba(0,0,0,.18);
    color: var(--text);
    outline:none;
    transition: var(--transition);
    font-family: var(--sans);
  }
  
  .input:focus, select:focus, textarea:focus {
    border-color: rgba(125,211,252,.5);
    box-shadow: 0 0 0 2px rgba(125,211,252,.2);
  }
  
  .input, select {
    cursor: text;
  }
  
  textarea{min-height:120px; resize:vertical}
  
  .tools .input, .tools select{width:auto; min-width:240px}
  .tools select{min-width:190px}
  
  .mini{color:var(--muted); font-size:12px}
  
  table{width:100%; border-collapse:separate; border-spacing:0}
  th, td{padding:10px 10px; border-bottom:1px solid rgba(255,255,255,.08); vertical-align:top}
  th{color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.12em; text-align:left}
  td{font-size:14px}
  .nowrap{white-space:nowrap}
  
  .cellSelect{
    width:100%;
    padding:8px 10px;
    border-radius: 12px;
    border:1px solid rgba(255,255,255,.10);
    background: rgba(0,0,0,.18);
    color:var(--text);
    transition: var(--transition);
    cursor: pointer;
  }
  
  .cellSelect:focus {
    border-color: rgba(125,211,252,.5);
    box-shadow: 0 0 0 2px rgba(125,211,252,.2);
  }
  
  .rowActions{white-space:nowrap}
  
  .iconBtn{
    display:inline-flex; align-items:center; justify-content:center;
    width:34px; height:34px; border-radius:12px;
    border:1px solid rgba(255,255,255,.10);
    background: rgba(255,255,255,.03);
    color: var(--text);
    cursor:pointer;
    margin-right:6px;
    transition: var(--transition);
  }
  
  .iconBtn svg{width:18px; height:18px; fill:currentColor; opacity:.92}
  .iconBtn.danger{border-color: rgba(239,68,68,.35); color: var(--bad)}
  
  .iconBtn:hover{
    border-color: rgba(255,255,255,.22);
    transform: translateY(-2px) scale(1.1);
    box-shadow: 0 5px 10px rgba(0,0,0,0.2);
  }
  
  .badge{
    display:inline-flex; align-items:center; gap:8px;
    padding:6px 10px; border-radius:999px;
    border:1px solid rgba(255,255,255,.10);
    background: rgba(255,255,255,.02);
    font-size:12px; color:var(--muted);
    transition: var(--transition);
  }
  
  .badge:hover {
    background: rgba(255,255,255,.08);
  }
  
  .badge strong{color:var(--text)}
  
  /* Chart Section Styles */
  .charts-container {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
    gap: 20px;
    margin-top: 20px;
  }
  
  .chart-card {
    background: var(--chart-bg);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: var(--r);
    padding: 18px;
    box-shadow: var(--shadow);
    transition: var(--transition);
    display: flex;
    flex-direction: column;
    height: 100%;
    min-height: 340px;
  }
  
  .chart-card::before{
    content:"";
    position:absolute;
    left:0; right:0; top:0;
    height:4px;
    background: var(--accent);
    opacity:.75;
  }

.chart-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 20px 40px rgba(0,0,0,0.5);
  }
  
  .chart-card h3 {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 16px;
    color: var(--text);
    min-height: 40px;
    font-size: 16px;
    padding-bottom: 8px;
    border-bottom: 1px solid rgba(255,255,255,.05);
  }
  
  .chart-placeholder {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    flex-grow: 1;
    color: var(--muted);
    text-align: center;
    padding: 30px 20px;
    border-radius: 12px;
    background: rgba(0,0,0,.08);
    border: 1px dashed rgba(255,255,255,.08);
    margin-top: 10px;
  }
  
  /* Contenedor del gráfico */
  .chart-canvas-container {
    position: relative;
    flex-grow: 1;
    margin: 0;
    padding: 0;
    background: transparent !important;
  }
  
  /* Canvas del gráfico */
  .chart-canvas {
    width: 100% !important;
    height: 220px !important;
    max-height: 220px !important;
    background: transparent !important;
  }
  
  .chart-legend {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 12px;
    padding: 8px;
    background: rgba(0,0,0,.1);
    border-radius: 8px;
    font-size: 11px;
    max-height: 80px;
    overflow-y: auto;
  }
  
  .legend-item {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 4px 6px;
    background: rgba(255,255,255,.03);
    border-radius: 6px;
    cursor: pointer;
    transition: var(--transition);
    white-space: nowrap;
  }
  
  .legend-item:hover {
    background: rgba(255,255,255,.08);
    transform: translateY(-1px);
  }
  
  .legend-color {
    width: 10px;
    height: 10px;
    border-radius: 2px;
    flex-shrink: 0;
  }
  
  .stat-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }
  
  .stat-item {
    background: rgba(255,255,255,.03);
    padding: 12px;
    border-radius: 10px;
    border-left: 3px solid;
    transition: var(--transition);
    cursor: pointer;
  }
  
  .stat-item:hover {
    background: rgba(255,255,255,.08);
    transform: translateY(-2px);
  }
  
  .stat-label {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 5px;
  }
  
  .stat-value {
    font-size: 20px;
    font-weight: 700;
  }
  
  /* Insights Section - REVISADO: eliminado el fondo negro */
  .insights-section {
    margin-top: 20px;
    margin-bottom: 20px;
  }
  
  .insights-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
    flex-wrap: wrap;
    gap: 10px;
  }
  
  .insights-stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 15px;
    margin-bottom: 20px;
  }
  
  .insight-stat {
    background: rgba(255,255,255,.03);
    padding: 15px;
    border-radius: 12px;
    border-left: 4px solid;
  }
  
  .insight-stat.green { border-left-color: #22c55e; }
  .insight-stat.blue { border-left-color: #3b82f6; }
  .insight-stat.orange { border-left-color: #f59e0b; }
  .insight-stat.purple { border-left-color: #a855f7; }
  
  .insight-label {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 5px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  
  .insight-value {
    font-size: 24px;
    font-weight: 700;
    color: var(--text);
  }
  
  .insight-subtext {
    font-size: 12px;
    color: var(--muted);
    margin-top: 5px;
  }
  
  .date-selector {
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(255,255,255,.03);
    padding: 8px 12px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,.08);
  }
  
  .date-selector label {
    font-size: 13px;
    color: var(--muted);
  }
  
  .date-selector input {
    background: rgba(0,0,0,.2);
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 8px;
    padding: 6px 10px;
    color: var(--text);
    font-family: var(--sans);
  }
  
  /* Patient Summary Card - MEJORADO para mostrar resumen en lugar de tabla */
  .patient-summary-card {
    margin-top: 20px;
  }
  
  .patient-summary-card .tools {
    margin-bottom: 16px;
  }
  
  /* Patient Summary Cards */
  .patient-summary-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 15px;
    margin-top: 15px;
  }
  
  .patient-card {
    position: relative;
    background: rgba(255,255,255,.03);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: var(--r2);
    padding: 16px;
    transition: var(--transition);
    animation: fadeIn 0.5s ease-out;
  }
  
  .patient-card::before{
    content:"";
    position:absolute;
    left:0; top:0; bottom:0;
    width:5px;
    background: var(--accent);
    opacity:.9;
  }

  .patient-card:hover::before{
    filter: brightness(1.05);
  }

.patient-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    border-color: rgba(125,211,252,.15);
  }
  
  .patient-card-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 12px;
    padding-bottom: 10px;
    border-bottom: 1px solid rgba(255,255,255,.05);
  }
  
  .patient-id {
    font-weight: 700;
    font-size: 14px;
    color: var(--link);
    letter-spacing: 0.5px;
  }
  
  .patient-name {
    font-weight: 700;
    font-size: 16px;
    color: var(--text);
    margin-bottom: 4px;
  }
  
  .patient-meta {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 8px;
  }
  
  .patient-state {
    background: rgba(209,15,47,.1);
    color: #d10f2f;
    padding: 2px 8px;
    border-radius: 10px;
    font-weight: 600;
  }
  
  .patient-details {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-top: 12px;
  }
  
  .patient-detail {
    flex: 1;
    min-width: 120px;
  }
  
  .detail-label {
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 4px;
  }
  
  .detail-value {
    font-size: 13px;
    color: var(--text);
    font-weight: 500;
  }
  
  .patient-status {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    border-radius: 12px;
    font-size: 12px;
    font-weight: 600;
  }
  
  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
  }
  
  .status-sent { background: rgba(34,197,94,.2); color: #22c55e; }
  .status-sent .status-dot { background: #22c55e; }
  
  .status-new { background: rgba(59,130,246,.2); color: #3b82f6; }
  .status-new .status-dot { background: #3b82f6; }
  
  .status-needs-reply { background: rgba(245,158,11,.2); color: #f59e0b; }
  .status-needs-reply .status-dot { background: #f59e0b; }
  
  .waiting-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    background: rgba(125,211,252,.1);
    color: #7dd3fc;
    border-radius: 12px;
    font-size: 12px;
    font-weight: 600;
  }
  
  .patient-notes {
    margin-top: 12px;
    padding-top: 10px;
    border-top: 1px solid rgba(255,255,255,.05);
    font-size: 12px;
    color: var(--muted);
    line-height: 1.5;
  }
  
  /* Modal */
  .backdrop{
    position:fixed; inset:0; background:rgba(0,0,0,.6); 
    display:none; z-index:50; align-items:center; justify-content:center; padding:20px;
    animation: fadeIn 0.3s ease-out;
  }
  
  .modal{
    width:min(920px, 95vw);
    max-height: 90vh;
    display: flex;
    flex-direction: column;
    background: rgba(15,19,24,.92);

    const due = norm(p.dueDate);
    const done = (st==="done");

    if(f==="all") return true;
    if(f==="overdue") return !!due && due <= today && !done;
    if(f==="needs_reply") return st==="needs reply";
    if(f==="waiting_clinic") return wo==="clinic" && !done;
    if(f==="new_today") return (p.createdAt||"").slice(0,10)===today;
    return true;
  };

  const matchesHomeFilterTask = (t, today, f) => {
    f = (f||"all").toLowerCase();
    const prog = lower(t.progress);
    const due = norm(t.dueDate);
    if(prog!=="open") return false;

    if(f==="all") return true;
    if(f==="overdue") return !!due && due <= today;
    if(f==="needs_reply") return lower(t.taskType).includes("reply");
    return true;
  };

function getStatusProgress(status){
  const s = (status || "").toString().trim().toLowerCase();
  // Map common pipeline statuses to a completion percentage
  if(["new","intake","received"].includes(s)) return 20;
  if(["sent","submitted","queued"].includes(s)) return 30;
  if(["needs reply","needs response","pending","awaiting reply"].includes(s)) return 45;
  if(["scheduled","schedule","appt scheduled"].includes(s)) return 55;
  if(["treating","in treatment","treatment"].includes(s)) return 65;
  if(["active"].includes(s)) return 70;
  if(["completed","done","discharged","closed","finished"].includes(s)) return 100;
  return 50;
}

  function computeHome(){
    const today = new Date().toISOString().slice(0,10);

    // "Overdue today" counts PATIENTS only: due on/before today AND not Done
    const overdue = state.patients.filter(p =>
      p.dueDate && p.dueDate <= today && lower(p.status)!=="done"
    ).length;

    const needsReply = state.patients.filter(p => lower(p.status)==="needs reply").length
                    + state.tasks.filter(t => lower(t.taskType).includes("reply") && lower(t.progress)==="open").length;

    const newToday = state.patients.filter(p => (p.createdAt||"").slice(0,10)===today).length;
    const waitingClinic = state.patients.filter(p => lower(p.waitingOn)==="clinic" && lower(p.status)!=="done").length;

    return { overdue, needsReply, newToday, waitingClinic };
  }

  function ensureTaskForMatter(matter, taskType, description, priority="Medium"){
    const exists = state.tasks.some(t => (t.matter||"")===matter && (t.taskType||"")===taskType && lower(t.progress||"")==="open");
    if(exists) return false;
    state.tasks.unshift({
      id: cryptoId(),
      matter,
      taskType,
      priority,
      progress:"Open",
      dueDate:"",
      description,
      createdAt: new Date().toISOString()
    });
    return true;
  }

  function runQuickAction(kind){
    let created = 0;
    if(kind==="callClinic"){
      const targets = state.patients.filter(p => lower(p.waitingOn)==="clinic" && lower(p.status)!=="done");
      for(const p of targets){
        if(ensureTaskForMatter(p.matter, "Follow-up clinic", `Call clinic for update — ${p.patient} (${p.provider||"Provider"})`, "High")) created++;
      }
      toast("Quick Action", `Call Clinic: created ${created} task(s).`);
      state.ui.tab="Home";
      return;
    }
    if(kind==="sendReply"){
      const targets = state.patients.filter(p => lower(p.status)==="needs reply");
      for(const p of targets){
        if(ensureTaskForMatter(p.matter, "Reply email", `Send reply — ${p.patient} (${p.provider||"Provider"})`, "High")) created++;
      }
      toast("Quick Action", `Send Reply: created ${created} task(s).`);
      state.ui.tab="Home";
      return;
    }
    if(kind==="closeTasks"){
      state.ui.tab="Tasks";
      state.ui.taskSearch="";
      toast("Quick Action", "Opened Tasks to close items.");
      return;
    }
    if(kind==="clearFocus"){
      state.ui.patientSearch=""; state.ui.patientStatus="all"; state.ui.patientWaiting="all"; state.ui.patientOverdueOnly=false;
      state.ui.taskSearch=""; state.ui.chartSearch="";
      toast("Cleared", "Focus cleared.");
      state.ui.tab="Home";
      return;
    }
  }

function filteredPatients(){
    const q = lower(state.ui.patientSearch);
    const status = state.ui.patientStatus;
    const waiting = state.ui.patientWaiting;
    const overdueOnly = !!state.ui.patientOverdueOnly;
    const today = new Date().toISOString().slice(0,10);

    return state.patients
      .filter(p => {
        const hay = lower([p.matter,p.patient,p.state,p.type,p.provider,p.providerEmail,p.requestedDate,p.dueDate,p.sender,p.status,p.waitingOn,p.notes].join(" "));
        if(q && !hay.includes(q)) return false;
        if(status && status!=="all" && norm(p.status)!==status) return false;
        if(waiting && waiting!=="all" && norm(p.waitingOn)!==waiting) return false;
        if(overdueOnly){
          if(!p.dueDate) return false;
          if(p.dueDate > today) return false;
          if(lower(p.status)==="done") return false;
        }
        return true;
      });
  }

  // Función para calcular datos de los gráficos
  function calculateChartData() {
    const statusCounts = {};
    const waitingCounts = {};
    const typeCounts = {};
    
    // Initialize counts
    OPTIONS.patientStatus.forEach(s => statusCounts[s] = 0);
    OPTIONS.waitingOn.forEach(w => waitingCounts[w] = 0);
    OPTIONS.patientTypes.forEach(t => typeCounts[t] = 0);
    
    // Count actual data
    state.patients.forEach(p => {
      if(p.status) statusCounts[p.status] = (statusCounts[p.status] || 0) + 1;
      if(p.waitingOn) waitingCounts[p.waitingOn] = (waitingCounts[p.waitingOn] || 0) + 1;
      if(p.type) typeCounts[p.type] = (typeCounts[p.type] || 0) + 1;
    });
    
    // Filter out zero values for charts
    const filteredStatusCounts = Object.entries(statusCounts).filter(([_, count]) => count > 0);
    const filteredWaitingCounts = Object.entries(waitingCounts).filter(([_, count]) => count > 0);
    const filteredTypeCounts = Object.entries(typeCounts).filter(([_, count]) => count > 0);
    
    return {
      statusData: {
        labels: filteredStatusCounts.map(([label]) => label),
        data: filteredStatusCounts.map(([_, count]) => count),
        total: state.patients.length
      },
      waitingData: {
        labels: filteredWaitingCounts.map(([label]) => label),
        data: filteredWaitingCounts.map(([_, count]) => count),
        total: state.patients.length
      },
      typeData: {
        labels: filteredTypeCounts.map(([label]) => label),
        data: filteredTypeCounts.map(([_, count]) => count),
        total: state.patients.length
      }
    };
  }

  // Función para calcular insights - REVISADO: eliminado fondo negro
  function calculateInsights(selectedDate) {
    // Calcular estadísticas
    const totalPatients = state.patients.length;
    const totalTasks = state.tasks.length;
    const totalReports = state.reports.length;
    
    // Encontrar el estado más común
    const statusCounts = {};
    state.patients.forEach(p => {
      statusCounts[p.status] = (statusCounts[p.status] || 0) + 1;
    });
    const mostCommonStatus = Object.entries(statusCounts)
      .sort((a, b) => b[1] - a[1])[0] || ["None", 0];
    
    // Encontrar el tipo más común
    const typeCounts = {};
    state.patients.forEach(p => {
      typeCounts[p.type] = (typeCounts[p.type] || 0) + 1;
    });
    const mostCommonType = Object.entries(typeCounts)
      .sort((a, b) => b[1] - a[1])[0] || ["None", 0];
    
    // Calcular pacientes por estado
    const sentToClinic = state.patients.filter(p => p.status === "Sent to clinic").length;
    const needsReply = state.patients.filter(p => p.status === "Needs reply").length;
    const newPatients = state.patients.filter(p => p.status === "New").length;
    
    // Calcular tareas pendientes
    const openTasks = state.tasks.filter(t => t.progress === "Open").length;
    const highPriorityTasks = state.tasks.filter(t => t.priority === "High" && t.progress === "Open").length;
    
    return {
      totalPatients,
      totalTasks,
      totalReports,
      mostCommonStatus: {
        name: mostCommonStatus[0],
        count: mostCommonStatus[1],
        percentage: Math.round((mostCommonStatus[1] / totalPatients) * 100)
      },
      mostCommonType: {
        name: mostCommonType[0],
        count: mostCommonType[1],
        percentage: Math.round((mostCommonType[1] / totalPatients) * 100)
      },
      sentToClinic,
      needsReply,
      newPatients,
      openTasks,
      highPriorityTasks
    };
  }

              backgroundColor: chartData.typeData.labels.map((_, i) => colors[(i+4) % colors.length]),
              borderColor: 'rgba(255,255,255,0.15)',
              borderWidth: 1,
              hoverOffset: 12
            }]
          },
          options: {
            ...commonOptions,
            animation: {
              animateScale: true,
              animateRotate: true
            }
          }
        });
      }
    }
  }

  function filterPatientsForCharts() {
    const searchTerm = lower(state.ui.chartSearch || "");
    if (!searchTerm) return state.patients;
    
    return state.patients.filter(p => {
      const hay = lower([p.matter, p.patient, p.provider, p.notes].join(" "));
      return hay.includes(searchTerm);
    });
  }

  function renderReports(){
    const current = state.ui.reportEditingId ? state.reports.find(r => r.id===state.ui.reportEditingId) : null;
    const label = state.ui.reportEditingId ? `Editing saved report • ${current ? current.when : ""}` : "4pm report";

    return `
      <div class="pageTitle">Reports</div>
      <p class="pageHint">${escapeHtml(label)}</p>

      <div class="card">
        <h3>📊 4pm report</h3>
        <div class="mini">Generate, copy, and save your daily report. Saves are tracked.</div>

        <div style="margin-top:12px">
          <textarea id="reportText" class="input" placeholder="Click Generate 4pm Draft…" style="min-height:150px">${escapeHtml(state.ui.reportEditingId ? (current?.text||"") : (state.ui.currentDraft||""))}</textarea>

          <button class="btn primary" id="btnGenerateHere">${ICON_SAVE} Generate</button>
          <button class="btn" id="btnCopyReport">Copy</button>
          <button class="btn" id="btnSaveReport">${ICON_SAVE} Save</button>

  function renderReportLog(){
    if(state.reports.length===0){
      return `<div class="mini">No saved reports yet.</div>`;
    }
    const rows = state.reports.map(r => `
      <tr>
        <td class="nowrap">${escapeHtml(r.when)}</td>
        <td style="max-width:520px">${escapeHtml((r.text||"").slice(0,120))}${(r.text||"").length>120?"…":""}</td>
        <td class="rowActions">
          <button class="iconBtn" data-action="edit_report" data-id="${escapeHtml(r.id)}" title="Edit">${ICON_EDIT}</button>
          <button class="iconBtn danger" data-action="del_report" data-id="${escapeHtml(r.id)}" title="Delete">${ICON_TRASH}</button>
        </td>
      </tr>
    `).join("");

    return `
      <div style="overflow:auto">
        <table>
          <thead><tr><th>Date/Time</th><th>Preview</th><th></th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    `;
  }

  function wirePage(){

    // Patient saved views

      const view = el.dataset.view;
      state.ui.patientView = view;

        "All": ()=>{ state.ui.patientStatus="all"; state.ui.patientWaiting="all"; state.ui.patientOverdueOnly=false; state.ui.patientSearch=""; }
      };
      (map[view]||(()=>{}))();

    // Bulk selection: Patients
    $("#pSelectAll")?.addEventListener("change", (e)=>{
      const checked = e.target.checked;
      const list = filteredPatients().map(p=>p.matter);
      state.ui.selectedPatients = checked ? list : [];
      render();
    });
    $$(".pSel").forEach(cb => cb.addEventListener("change", ()=>{
      const matter = cb.dataset.matter;
      const sel = new Set(state.ui.selectedPatients||[]);

      state.ui.selectedPatients = Array.from(sel);

    $("#bulkPApply")?.addEventListener("click", ()=>{

      const w  = $("#bulkPWaiting")?.value || "";
      for(const matter of (state.ui.selectedPatients||[])){
        const p = state.patients.find(x=>x.matter===matter);
        if(!p) continue;
        if(st) p.status = st;
        if(w) p.waitingOn = w;
      }
      toast("Bulk update","Patients updated.");
      render();
    });
    $("#bulkPAddNote")?.addEventListener("click", ()=>{
      const note = prompt("Add note to selected patients:");
      if(note==null) return;
      for(const matter of (state.ui.selectedPatients||[])){
        const p = state.patients.find(x=>x.matter===matter);
        if(!p) continue;
        p.notes = (p.notes ? (p.notes + " | ") : "") + note;
      }
      toast("Bulk update","Notes updated.");
      render();
    });
    $("#bulkPClear")?.addEventListener("click", ()=>{ state.ui.selectedPatients=[]; render(); });
    $("#bulkPDelete")?.addEventListener("click", ()=>{
      openConfirm("Delete selected", `Delete ${state.ui.selectedPatients.length} selected patient(s)?`, ()=>{
        const setSel = new Set(state.ui.selectedPatients||[]);
        state.patients = state.patients.filter(p => !setSel.has(p.matter));
        state.ui.selectedPatients = [];
        toast("Deleted","Selected patients deleted.");
        render();

    // Bulk selection: Tasks
    $("#tSelectAll")?.addEventListener("change", (e)=>{

      const list = filteredTasks().map(t=>t.id);
      state.ui.selectedTasks = checked ? list : [];
      render();

    $$(".tSel").forEach(cb => cb.addEventListener("change", ()=>{

      state.ui.selectedTasks = Array.from(sel);
      render();
    }));

    $("#bulkTApply")?.addEventListener("click", ()=>{
      const prg = $("#bulkTProgress")?.value || "";
      const pri = $("#bulkTPriority")?.value || "";

        const t = state.tasks.find(x=>x.id===id);

        if(pri) t.priority = pri;
      }
      toast("Bulk update","Tasks updated.");
      render();
    });
    $("#bulkTSnooze")?.addEventListener("click", ()=>{
      const add1 = (d)=>{
        const dt = d ? new Date(d+"T00:00:00") : new Date();
        dt.setDate(dt.getDate()+1);
        return dt.toISOString().slice(0,10);
      };
      for(const id of (state.ui.selectedTasks||[])){
        const t = state.tasks.find(x=>x.id===id);
        if(!t) continue;
        t.dueDate = add1(t.dueDate);
      }
      toast("Snoozed","+1 day applied.");
      render();
    });
    $("#bulkTClear")?.addEventListener("click", ()=>{ state.ui.selectedTasks=[]; render(); });
    $("#bulkTDelete")?.addEventListener("click", ()=>{
      openConfirm("Delete selected", `Delete ${state.ui.selectedTasks.length} selected task(s)?`, ()=>{
        const setSel = new Set(state.ui.selectedTasks||[]);

        <div class="modalGrid">
          <input class="input" id="tpl_matter" placeholder="Matter" value="${escapeHtml(matter)}"/>
          <select class="input" id="tpl_priority">${buildOptions(OPTIONS.taskPriority, "High")}</select>

          <input class="input" id="tpl_due" type="date" placeholder="Due date"/>

          <textarea class="input" id="tpl_desc" style="min-height:130px">${escapeHtml(desc)}</textarea>

          taskType: norm($("#tpl_type").value),
          progress: norm($("#tpl_progress").value),
          dueDate: norm($("#tpl_due").value),

          createdAt: new Date().toISOString()
        };

    $("#tplRequestRecords")?.addEventListener("click", tpl("Other", "Request records from clinic"));
    $("#tplConfirmAppt")?.addEventListener("click", tpl("Other", "Confirm appointment details"));


    // Home KPI pills
    $$("[data-action^='home_']").forEach(el => el.addEventListener("click", () => {
      const a = el.dataset.action;
      if(a==="home_needs_reply"){ state.ui.homeFilter="needs_reply"; state.ui.tab="Home"; }
      if(a==="home_waiting_clinic"){ state.ui.homeFilter="waiting_clinic"; state.ui.tab="Home"; }
      if(a==="home_new_today"){ state.ui.homeFilter="new_today"; state.ui.tab="Home"; }
      if(a==="home_overdue"){ state.ui.homeFilter="overdue"; state.ui.tab="Home"; }
      render();
    }));

    // Patients tools
    const ps = $("#patientSearch");
    if(ps){
      ps.addEventListener("input", (e) => {
        state.ui.patientSearch = e.target.value;
        saveState();
      });
      
      let searchTimeout;
      ps.addEventListener("keyup", (e) => {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(() => {
          render();
        }, 300);
      });

        if (e.key === "Enter") {
          render();
        }
      });
      
      $("#patientStatusFilter")?.addEventListener("change", (e) => { 
        state.ui.patientStatus = e.target.value; 
        render(); 
      });
      
      $("#patientWaitingFilter")?.addEventListener("change", (e) => { 
        state.ui.patientWaiting = e.target.value; 
        render(); 
      });
      
      $("#patientClear")?.addEventListener("click", () => { 
        state.ui.patientSearch = ""; 
        state.ui.patientStatus = "all"; 
        state.ui.patientWaiting = "all"; 
        render(); 
      });
      
      $("#btnQuickPatient")?.addEventListener("click", openQuickPatient);
    }

    // Tasks tools
    const ts = $("#taskSearch");
    if(ts){
      ts.addEventListener("input", (e) => {
        state.ui.taskSearch = e.target.value;
        saveState();
      });
      
      let taskSearchTimeout;
      ts.addEventListener("keyup", (e) => {
        clearTimeout(taskSearchTimeout);
        taskSearchTimeout = setTimeout(() => {
          render();
        }, 300);
      });
      
      ts.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          render();
        }
      });
      
      $("#taskClear")?.addEventListener("click", () => { 
        state.ui.taskSearch = ""; 
        render(); 
      });
      
      $("#btnQuickTask")?.addEventListener("click", openQuickTask);
    }

    // Charts section search
    const cs = $("#chartSearch");
    if(cs){
      cs.addEventListener("input", (e) => {
        state.ui.chartSearch = e.target.value;
        saveState();
      });
      
      let chartSearchTimeout;
      cs.addEventListener("keyup", (e) => {
        clearTimeout(chartSearchTimeout);
        chartSearchTimeout = setTimeout(() => {
          render();
        }, 300);
      });
      
      $("#chartSearchClear")?.addEventListener("click", () => { 
        state.ui.chartSearch = ""; 
        render(); 
      });
    }

    // Insights date selector
    const insightDate = $("#insightDate");
    if(insightDate){
      insightDate.addEventListener("change", (e) => {
        state.ui.insightDate = e.target.value;
        render();
      });
      
      $("#resetInsightDate")?.addEventListener("click", () => {
        state.ui.insightDate = new Date().toISOString().split('T')[0];
        render();
      });
    }

    // Charts filter clicks
    $$("[data-action='chart_filter']").forEach(el => {
      el.addEventListener("click", (e) => {
        const filter = el.dataset.filter;
        if (filter) {
          const [type, value] = filter.split(":");
          if (type === "status") {
            state.ui.tab = "Patients";
            state.ui.patientStatus = value;
            state.ui.patientWaiting = "all";
            state.ui.patientSearch = "";
            toast("Filter Applied", `Showing patients with status: ${value}`);
          } else if (type === "waiting") {
            state.ui.tab = "Patients";
            state.ui.patientWaiting = value;
            state.ui.patientStatus = "all";
            state.ui.patientSearch = "";
            toast("Filter Applied", `Showing patients waiting on: ${value}`);
          } else if (type === "type") {
            state.ui.tab = "Patients";
            state.ui.patientSearch = value;
            state.ui.patientStatus = "all";
            state.ui.patientWaiting = "all";
            toast("Filter Applied", `Showing patients of type: ${value}`);
          } else if (type === "progress") {
            state.ui.tab = "Tasks";
            state.ui.taskSearch = "";
            toast("Filter Applied", `Showing tasks with progress: ${value}`);

            state.ui.patientStatus = "all";

            toast("Filter Applied", "Showing patients created today");

      $("#btnGenerateHere")?.addEventListener("click", () => { generateDraftInto("#reportText"); });
      $("#btnCopyReport")?.addEventListener("click", copyReport);
      $("#btnSaveReport")?.addEventListener("click", saveReportFromTextarea);
      $("#btnClearReport")?.addEventListener("click", () => { 
        state.ui.reportEditingId = null; 
        state.ui.currentDraft = ""; 
        render(); 
      });
    }

    // Delegated actions for the entire page
    $("#page").addEventListener("click", (e)=>{
      const actEl = e.target.closest("[data-action]");
      if(!actEl) return;
      const action = actEl.dataset.action;

            if(action==="home_focus"){
        state.ui.homeFilter = actEl.dataset.filter || "all";
        toast("Home focus", `Focus: ${(state.ui.homeFilter||"all").replace("_"," ")}`);
        render();
        return;
      }
      if(action==="home_action"){
        const kind = actEl.dataset.kind || "";
        const today = new Date().toISOString().slice(0,10);

        if(kind==="send_reply"){
          // Create "Reply email" tasks for needs-reply patients (top 8) if missing
          const targets = state.patients
            .filter(p => lower(p.status)==="needs reply" && lower(p.status)!=="done")
            .slice()
            .sort((a,b)=>patientPriorityScore(b,today)-patientPriorityScore(a,today))
            .slice(0,8);

          let made = 0;
          targets.forEach(p=>{
            const matter = p.matter||"";
            if(!matter) return;
            const exists = state.tasks.some(t => lower(t.progress)==="open" && (t.matter||"")===matter && lower(t.taskType||"").includes("reply"));
            if(exists) return;
            state.tasks.unshift({
              id: cryptoId(),
              matter,
              priority:"High",
              taskType:"Reply email",
              progress:"Open",
              dueDate: today,
              description:"Send reply/update and document outcome (auto-created from Home).",
              createdAt: new Date().toISOString()
            });
            made += 1;
          });

          state.ui.homeFilter = "needs_reply";
          persist();
          toast("Send Reply", made ? `Created ${made} task(s).` : "No new tasks needed.");
          render();
          return;
        }

        if(kind==="close_task"){
          state.ui.tab = "Tasks";
          toast("Close Task", "Switched to Tasks. Use bulk Progress → Done.");
          render();
          return;
        }

        if(kind==="clear_focus"){
          state.ui.homeFilter = "all";
          toast("Home", "Focus cleared.");
          render();
          return;
        }
      }
      if(action==="home_quick_patient"){
        openQuickPatient();
        return;
      }
      if(action==="home_quick_task"){
        openQuickTask();
        return;
      }
      if(action==="open_patient"){

        state.ui.tab="Patients";
        state.ui.patientSearch = actEl.dataset.matter || "";
        state.ui.patientStatus="all";
        state.ui.patientWaiting="all";
        state.assistant.lastMatter = actEl.dataset.matter || null;
        render();
        return;
      }
      if(action==="edit_patient"){ editPatient(actEl.dataset.matter); return; }
      if(action==="del_patient"){ 
        const matter = actEl.dataset.matter;
        const patient = state.patients.find(p => p.matter === matter);
        const patientName = patient ? patient.patient : matter;
        
        // Use the new confirmation modal instead of native confirm
        openConfirm(
          "Delete Patient", 
          `Are you sure you want to delete patient ${patientName} (Matter: ${matter})?`,
          () => {
            deletePatient(matter);
          }
        );
        return; 
      }
      if(action==="edit_task"){ editTask(actEl.dataset.id); return; }
      if(action==="del_task"){ 
        const taskId = actEl.dataset.id;
        const task = state.tasks.find(t => t.id === taskId);
        const matterInfo = task ? `for Matter ${task.matter}` : "";
        
        // Use the new confirmation modal instead of native confirm
        openConfirm(
          "Delete Task", 
          `Are you sure you want to delete this task ${matterInfo}?`,
          () => {
            deleteTask(taskId);
          }
        );
        return; 
      }
      if(action==="edit_report"){ state.ui.tab="Reports"; state.ui.reportEditingId = actEl.dataset.id; render(); return; }
      if(action==="del_report"){ 
        const reportId = actEl.dataset.id;
        const report = state.reports.find(r => r.id === reportId);
        const reportDate = report ? report.when : "this report";
        
        // Use the new confirmation modal instead of native confirm
        openConfirm(
          "Delete Report", 
          `Are you sure you want to delete the report saved on ${reportDate}?`,
          () => {
            deleteReport(reportId);
          }
        );
        return; 
      }
    });

    $("#page").addEventListener("change", (e)=>{
      const sel = e.target.closest("[data-action='p_update'], [data-action='t_update']");
      if(!sel) return;

      if(sel.dataset.action==="p_update"){
        const matter = sel.dataset.matter;
        const field = sel.dataset.field;
        updatePatientField(matter, field, sel.value);
      }
      if(sel.dataset.action==="t_update"){
        const id = sel.dataset.id;
        const field = sel.dataset.field;
        updateTaskField(id, field, sel.value);
      }
    });
  }

  function openQuickPatient(){
    openModal("Quick Log — Patient", `
      <div class="modalGrid">
        <div class="formSectionTitle">Patient info</div>

        <input class="input" id="ql_due" type="date" placeholder="Due date / Fecha de vencimiento" title="Due date (drives 'Overdue today' from Patients)"/>
        <div class="formHelp">Tip: "Overdue today" is calculated from Patients using "Due date".</div>

        <div class="formSectionTitle">Status</div>
        <input class="input" id="ql_sender" placeholder="Sender (Email / Web page / etc.)"/>

      </div>
      <div style="margin-top:10px">
        <textarea class="input" id="ql_notes" placeholder="Notes" style="min-height:140px"></textarea>
      </div>
    `, "Adds a patient and updates Home + Assistant immediately.", ()=>{
      const p = {
        matter: norm($("#ql_matter").value),
        patient: norm($("#ql_patient").value),
        state: norm($("#ql_state").value),
        type: norm($("#ql_type").value),
        provider: norm($("#ql_provider").value),
        providerEmail: norm($("#ql_providerEmail").value),
        requestedDate: norm($("#ql_req").value),
        dueDate: norm($("#ql_due").value),
        sender: norm($("#ql_sender").value),
        status: norm($("#ql_status").value),
        waitingOn: norm($("#ql_waiting").value),
        notes: norm($("#ql_notes").value),
        createdAt: new Date().toISOString()
      };
      if(!p.matter || !p.patient){ 
        openConfirm("Validation Error", "Matter and Patient are required.", () => {});
        return; 
      }
      const idx = state.patients.findIndex(x => x.matter===p.matter);
      if(idx>=0) state.patients[idx] = {...state.patients[idx], ...p};
      else state.patients.unshift(p);
      state.assistant.lastMatter = p.matter;
      addAssistantSystem(`Added/updated patient ${p.matter} (${p.patient}).`);
      render();
    });
    
    setTimeout(() => {
      $("#ql_matter")?.focus();
    }, 100);
  }

  function editPatient(matter){
    const p = state.patients.find(x => x.matter===matter);
    if(!p){ toast("Not found", `Patient ${matter} not found.`); return; }
    openModal(`Edit Patient • ${matter}`, `
      <div class="modalGrid">
        <input class="input" id="ep_patient" placeholder="Patient name" value="${escapeHtml(p.patient||"")}"/>
        <input class="input" id="ep_state" placeholder="State" value="${escapeHtml(p.state||"")}"/>
        <select class="input" id="ep_type">${buildOptions(OPTIONS.patientTypes, p.type||"MRI")}</select>
        <input class="input" id="ep_provider" placeholder="Provider name" value="${escapeHtml(p.provider||"")}"/>
        <input class="input" id="ep_providerEmail" placeholder="Provider email" value="${escapeHtml(p.providerEmail||"")}"/>
        <input class="input" id="ep_req" placeholder="Requested date" value="${escapeHtml(p.requestedDate||"")}"/>

  // -----------------------------

  function generateDraft(){
    const openTasks = state.tasks.filter(t => lower(t.progress)==="open");
    const needsReply = state.patients.filter(p => lower(p.status)==="needs reply");
    const waitingClinic = state.patients.filter(p => lower(p.waitingOn)==="clinic" && lower(p.status)!=="done");

    const lines = [];
    lines.push(`4pm Report — ${nowStamp()}`);
    lines.push("");
    lines.push(`Patients waiting on clinic: ${waitingClinic.length}`);
    for(const p of waitingClinic.slice(0,12)){
      lines.push(`- ${p.matter}: ${p.patient} • ${p.type||""} • Provider: ${p.provider||""} • Status: ${p.status||""} • Notes: ${p.notes||""}`.trim());
    }
    lines.push("");
    lines.push(`Needs reply: ${needsReply.length}`);
    for(const p of needsReply.slice(0,12)){
      lines.push(`- ${p.matter}: ${p.patient} • Provider: ${p.provider||""} • Notes: ${p.notes||""}`.trim());
    }
    lines.push("");
    lines.push(`Open tasks: ${openTasks.length}`);
    for(const t of openTasks.slice(0,18)){
      lines.push(`- ${t.matter}: [${t.priority}] ${t.taskType} — ${t.description}`.trim());
    }
    lines.push("");
    lines.push("End.");
    return lines.join("\n");
  }

  function generateDraftInto(selector){
    const draft = generateDraft();
    const ta = $(selector);
    if(ta) ta.value = draft;
    state.ui.currentDraft = draft;
    state.ui.reportEditingId = null;
    toast("Draft generated","4pm draft was generated from current Patients + Tasks.");
    render();

      {cmd: "help", desc: "Show all commands"},
      {cmd: "show overdue", desc: "List overdue (due on/before today)"},
      {cmd: "show needs reply", desc: "Show patients needing reply"},
      {cmd: "show patients status New", desc: "Show patients with status New"},

  function addAssistant(role, text, meta){
    state.assistant.chat.push({ role, text, meta: meta||"" });
    saveState();
    renderAssistant();
  }
  
  function addAssistantSystem(text){
    addAssistant("sys", text);
  }

  function parseMatterFromText(s){
    const m = s.match(/\bM?-?\s*(\d{4,})\b/i);
    return m ? m[1] : null;
  }

  function assistantRespond(input){
    const raw = norm(input);
    const msg = lower(raw);

    const today = new Date().toISOString().slice(0,10);

    const STATUS = OPTIONS.patientStatus;
    const WAITING = OPTIONS.waitingOn;
    const TASK_TYPES = OPTIONS.taskType;
    const PRIORITIES = OPTIONS.taskPriority;
    const PROGRESS = OPTIONS.taskProgress;

    const simplify = (s)=> lower((s||"").replace(/[_\-]+/g," ").replace(/[^\w\s]/g," ").replace(/\s+/g," ").trim());
    const msgS = simplify(raw);

    const bestMatch = (candidates, text) => {
      const t = simplify(text);
      // exact / includes
      for(const c of candidates){
        const cs = simplify(c);
        if(t === cs) return c;
        if(t.includes(cs)) return c;
      }
      // partial token match
      const toks = t.split(" ").filter(Boolean);
      for(const c of candidates){
        const cs = simplify(c);
        const ctoks = cs.split(" ");
        if(ctoks.every(x => toks.includes(x))) return c;
      }
      // common aliases
      const alias = {
        "needsreply":"Needs reply",
        "needs reply":"Needs reply",
        "sent":"Sent to clinic",
        "sent to clinic":"Sent to clinic",
        "new":"New",
        "done":"Done",
        "stuck":"Stuck"
      };
      for(const [a,val] of Object.entries(alias)){
        if(t.includes(a)) return val;
      }
      return null;
    };

    const extractAfter = (re) => {
      const m = raw.match(re);
      return m ? m[1].trim() : "";
    };

    const listOverdue = () => {
      const overduePatients = state.patients
        .filter(p => p.dueDate && p.dueDate <= today && lower(p.status)!=="done")
        .sort((a,b)=> (a.dueDate||"").localeCompare(b.dueDate||""));
      const overdueTasks = state.tasks
        .filter(t => lower(t.progress)==="open" && t.dueDate && t.dueDate <= today)
        .sort((a,b)=> (a.dueDate||"").localeCompare(b.dueDate||""));

      const lines = [];
      lines.push(`Overdue (due on/before ${today}):`);
      lines.push(`• Patients: ${overduePatients.length}`);
      for(const p of overduePatients.slice(0,12)){
        lines.push(`  - ${p.matter}: ${p.patient} • due ${p.dueDate} • status ${p.status} • waiting ${p.waitingOn}`);
      }
      if(overduePatients.length>12) lines.push(`  … +${overduePatients.length-12} more`);
      lines.push(`• Tasks: ${overdueTasks.length}`);
      for(const t of overdueTasks.slice(0,12)){
        lines.push(`  - ${t.matter}: [${t.priority}] ${t.taskType} • due ${t.dueDate} • ${t.description}`);
      }
      if(overdueTasks.length>12) lines.push(`  … +${overdueTasks.length-12} more`);
      return lines.join("\n");
    };

    // HELP (EN/ES)
    if(msgS === "help" || msgS === "ayuda" || msgS === "?"){
      addAssistant("sys",
`I can do:
• show overdue
• show needs reply
• show patients status <status>
• show patients waiting on <who>
• open <matter>
• update patient <matter> status=... waitingOn=... dueDate=YYYY-MM-DD
• add patient
• add task
• export data
• generate report
• what's pending`
      );
      return;
    }

    // SHOW OVERDUE
    if(msgS.includes("overdue") || msgS.includes("vencid") || msgS.includes("atrasad")){
      addAssistant("sys", listOverdue());
      return;
    }

    // SHOW NEEDS REPLY
    if(msgS.includes("show needs reply") || msgS === "needs reply" || msgS.includes("show needs reply") || msgS.includes("necesita respuesta") ){
      state.ui.tab="Patients"; state.ui.patientStatus="Needs reply"; state.ui.patientWaiting="all"; state.ui.patientSearch="";
      addAssistant("sys","Showing patients/tasks that need reply.");
      render(); 
      return;
    }

    // SHOW CHARTS
    if(msgS.includes("show charts") || msgS.includes("view analytics") || msgS.includes("show charts") || msgS.includes("analytics")){
      state.ui.tab = "Charts";
      addAssistant("sys", "Opening charts and analytics.");
      render(); 
      return;
    }

    // SHOW PATIENTS BY STATUS (ex: "show patients with new status", "show patients status new")
    if((msgS.includes("show patients") || msgS.includes("show patients")) && (msgS.includes("status") || msgS.includes("status"))){
      let target = extractAfter(/(?:status|estado)\s*(?:is|=|:|to)?\s*([a-zA-Z\s]+)/i);
      if(!target && msgS.includes("new status")) target = "New";
      const status = bestMatch(STATUS, target || raw);
      if(status){
        state.ui.tab="Patients";
        state.ui.patientStatus=status;
        state.ui.patientWaiting="all";
        state.ui.patientSearch="";
        addAssistant("sys", `Showing patients with status: ${status}`);
        render();
        return;
      }
    }

    // SHOW PATIENTS BY WAITING ON
    if((msgS.includes("show patients") || msgS.includes("show patients")) && (msgS.includes("waiting on") || msgS.includes("waiting") || msgS.includes("waiting"))){
      let target = extractAfter(/(?:waiting on|esperando)\s*(?:is|=|:|a)?\s*([a-zA-Z\s]+)/i);
      const waiting = bestMatch(WAITING, target || raw);
      if(waiting){
        state.ui.tab="Patients";
        state.ui.patientWaiting=waiting;
        state.ui.patientStatus="all";
        state.ui.patientSearch="";
        addAssistant("sys", `Showing patients waiting on: ${waiting}`);
        render();
        return;
      }
    }

    // OPEN
    if(msgS.startsWith("open ") || msgS.startsWith("abrir ")){
      const matter = parseMatterFromText(raw) || state.assistant.lastMatter;
      if(matter){
        state.ui.tab="Patients";
        state.ui.patientSearch = matter;
        state.ui.patientStatus="all";
        state.ui.patientWaiting="all";
        state.assistant.lastMatter = matter;
        addAssistant("sys",`Opening matter ${matter} in Patients.`);
        render(); 
        return;
      }
    }

    // PATIENT SUMMARY QUERY ("status of ...", "qué pasó con ...")
    if(msgS.includes("give an update") || msgS.includes("update about") || msgS.includes("status of") || msgS.includes("what about")
       || msgS.includes("give me an update") || msgS.includes("status of") || msgS.includes("what happened with")){
      const name = input.split(/about|of|de|con/i)[1]?.trim();
      const p = name ? state.patients.find(x => lower(x.patient).includes(lower(name)) || x.matter === name) : null;
      if(p){
        state.assistant.lastMatter = p.matter;
        addAssistant("sys", `Patient: ${p.patient} • Matter: ${p.matter} • Type: ${p.type||""} • Provider: ${p.provider||""} • Status: ${p.status||""} • Waiting On: ${p.waitingOn||""} • Requested: ${p.requestedDate||""} • Due: ${p.dueDate||"-"}\nNotes: ${p.notes||""}`);
      }else{
        addAssistant("sys", "I couldn't find that patient name in your list yet.");
      }
      return;
    }

    // WHAT'S PENDING
    if(msgS.includes("what's pending") || msgS.includes("what do i have") || msgS.includes("pending items")
       || msgS.includes("que tengo pendiente") || msgS.includes("pendiente")){
      const overduePatients = state.patients.filter(p => p.dueDate && p.dueDate <= today && lower(p.status)!=="done").length;
      const overdueTasks = state.tasks.filter(t => t.progress === "Open" && t.dueDate && t.dueDate <= today).length;
      const needsReplyPatients = state.patients.filter(p => p.status === "Needs reply").length;
      addAssistant("sys", `You have: • ${overduePatients+overdueTasks} overdue (patients+tasks) • ${needsReplyPatients} patients needing reply • ${state.patients.filter(p => p.waitingOn === "Clinic").length} waiting on clinic`);
      return;
    }

    // CLEAR FILTERS
    if(msgS.includes("clear search") || msgS.includes("clear filters") || msgS.includes("limpiar filtros") || msgS.includes("limpiar busqueda")){
      state.ui.patientSearch = "";
      state.ui.patientStatus = "all";
      state.ui.patientWaiting = "all";
      state.ui.taskSearch = "";
      state.ui.chartSearch = "";
      addAssistant("sys", "Cleared all search filters.");
      render();
      return;
    }

    // EXPORT
    if(msgS.includes("export data") || msgS.includes("download excel") || msgS.includes("download data") || msgS.includes("exportar")){
      downloadCSV();
      addAssistant("sys", "Downloading all patient data as CSV file.");
      return;
    }

    // GENERATE REPORT
    if(msgS.includes("generate report") || msgS.includes("create report") || msgS.includes("generar reporte") || msgS.includes("generar informe")){
      state.ui.tab = "Reports";
      generateDraftInto("#reportText");
      addAssistant("sys", "Generated 4pm report and opened Reports tab.");
      return;
    }

    // ADD
    if(msgS.includes("add patient") || msgS.includes("new patient") || msgS.includes("add patient") || msgS.includes("new patient")){
      openQuickPatient();
      addAssistant("sys", "Opening Quick Log to add a new patient.");
      return;
    }

    if(msgS.includes("add task") || msgS.includes("new task") || msgS.includes("agregar tarea") || msgS.includes("nueva tarea")){
      openQuickTask();
      addAssistant("sys", "Opening Quick Log to add a new task.");
      return;
    }

    // UPDATE PATIENT (richer parsing, EN/ES)
    if(msgS.includes("update patient") || msgS.includes("update patient") || msgS.includes("update the patient")){
      const matter = parseMatterFromText(raw) || state.assistant.lastMatter;
      if(!matter){
        addAssistant("sys","Tell me the matter number (e.g., update patient 107853 status=Needs reply).");
        return;
      }
      const p = state.patients.find(x => x.matter===matter);
      if(!p){
        addAssistant("sys", `I can't update matter ${matter} because it isn't in Patients yet.`);
        return;
      }

      // key=value pairs (EN/ES keys)
      const pairs = Array.from(raw.matchAll(/\b(status|estado|waitingOn|esperando|type|tipo|provider|proveedor|state|estadoUS|patient|paciente|sender|remitente|requestedDate|requested|solicitado|dueDate|due|vencimiento)\s*=\s*([^,\n]+)/gi));
      if(pairs.length===0){
        addAssistant("sys","Tell me what to change. Example: update patient 107853 status=Needs reply waitingOn=You dueDate=2026-01-13");
        return;
      }

      for(const [,k,v] of pairs){
        const keyRaw = lower(k.trim());
        const val = norm(v);

        if(keyRaw==="status" || keyRaw==="status"){
          const st = bestMatch(STATUS, val);
          if(st) p.status = st; else p.status = val;
          continue;
        }
        if(keyRaw==="waitingon" || keyRaw==="waiting"){
          const w = bestMatch(WAITING, val);
          if(w) p.waitingOn = w; else p.waitingOn = val;
          continue;
        }
        if(keyRaw==="type" || keyRaw==="tipo"){
          const t = bestMatch(OPTIONS.patientTypes, val);
          if(t) p.type = t; else p.type = val;
          continue;
        }
        if(keyRaw==="provider" || keyRaw==="provider"){ p.provider = val; continue; }
        if(keyRaw==="state" || keyRaw==="estadous"){ p.state = val; continue; }
        if(keyRaw==="patient" || keyRaw==="patient"){ p.patient = val; continue; }
        if(keyRaw==="sender" || keyRaw==="sender"){ p.sender = val; continue; }
        if(keyRaw==="requesteddate" || keyRaw==="requested" || keyRaw==="solicitado"){ p.requestedDate = val; continue; }
        if(keyRaw==="duedate" || keyRaw==="due" || keyRaw==="vencimiento"){ p.dueDate = val; continue; }
      }

      state.assistant.lastMatter = matter;
      addAssistant("sys", `Updated patient ${matter}.`);
      render();
      return;
    }

    // If user typed a matter number, show quick summary
    const m = parseMatterFromText(raw);
    if(m){
      const p = state.patients.find(x => x.matter===m);
      if(p){
        state.assistant.lastMatter = p.matter;
        addAssistant("sys", `Patient: ${p.patient} • Matter: ${p.matter} • Status: ${p.status||""} • Waiting On: ${p.waitingOn||""} • Due: ${p.dueDate||"-"} • Provider: ${p.provider||""}\nNotes: ${p.notes||""}`);
      }else{
        addAssistant("sys", `I don't have matter ${m} saved yet. Add it via Quick Log → Patient.`);
      }
      return;
    }

    addAssistant("sys","Try: • help/ayuda • show overdue • show patients status New • show patients waiting on Clinic • open 107853 • update patient 107853 status=Needs reply dueDate=2026-01-13 • export data • generate report • what's pending");
  }

  // -----------------------------
  // CSV download
  // -----------------------------
  function downloadCSV(){
    const patientHeaders = ["Matter","Patient","State","Type","Provider","Provider Email","Requested Date","Due Date","Sender","Status","Waiting On","Notes", "Created At"];
    const patientRows = state.patients.map(p => [
      p.matter, p.patient, p.state, p.type, p.provider, p.providerEmail, p.requestedDate, p.dueDate, p.sender, p.status, p.waitingOn, p.notes, p.createdAt
    ]);
    
    const taskHeaders = ["ID","Matter","Task Type","Priority","Progress","Due Date","Description","Created At"];
    const taskRows = state.tasks.map(t => [
      t.id, t.matter, t.taskType, t.priority, t.progress, t.dueDate, t.description, t.createdAt
    ]);
    
    const reportHeaders = ["ID","Date/Time","Report Text"];
    const reportRows = state.reports.map(r => [
      r.id, r.when, r.text
    ]);
    
    const csvContent = [
      "MEDICAL DEPARTMENT COMMAND CENTER - FULL DATA EXPORT",
      `Exported: ${new Date().toLocaleString()}`,
      "",
      "=== PATIENTS ===",
      patientHeaders.join(","),
      ...patientRows.map(r => r.map(v => {
        const s = (v??"").toString().replace(/"/g,'""');
        return `"${s}"`;
      }).join(",")),
      "",
      "=== TASKS ===",
      taskHeaders.join(","),
      ...taskRows.map(r => r.map(v => {
        const s = (v??"").toString().replace(/"/g,'""');
        return `"${s}"`;
      }).join(",")),
      "",
      "=== SAVED REPORTS ===",
      reportHeaders.join(","),
      ...reportRows.map(r => r.map(v => {
        const s = (v??"").toString().replace(/"/g,'""');
        return `"${s}"`;
      }).join(",")),
      "",
      `Total Patients: ${state.patients.length}`,
      `Total Tasks: ${state.tasks.length}`,
      `Total Reports: ${state.reports.length}`
    ].join("\n");

    const blob = new Blob([csvContent], {type:"text/csv;charset=utf-8"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `medical-command-center-full-export-${new Date().toISOString().slice(0,10)}.csv`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=> URL.revokeObjectURL(url), 2000);
    
    toast("Data Exported", "All patient, task, and report data downloaded as CSV.");
  }

  // -----------------------------
  // Top-level buttons
  // -----------------------------
  $("#btnToggleAssistant").addEventListener("click", ()=>{
    state.assistant.open = !state.assistant.open;
    render();
  });

  $("#btnDownload").addEventListener("click", downloadCSV);

  $("#btnGenerate").addEventListener("click", ()=>{
    state.ui.tab = "Reports";
    state.ui.reportEditingId = null;
    state.ui.currentDraft = generateDraft();
    toast("Draft generated","Opened Reports with a new 4pm draft.");
    render();
  });

  $("#assistantSend").addEventListener("click", ()=>{
    const input = $("#assistantInput");
    const text = norm(input.value);
    if(!text) return;
    addAssistant("me", text);
    input.value = "";
    assistantRespond(text);
    
    setTimeout(() => input.focus(), 50);
  });

  $("#assistantInput").addEventListener("keydown", (e)=>{
    if(e.key==="Enter"){ 
      e.preventDefault(); 
      $("#assistantSend").click(); 
    }
  });

  // Initialize assistant
  if(state.assistant.chat.length === 0) {
    addAssistant("sys", "Hello! I'm your medical command center assistant. I can help you manage patients, tasks, generate reports, and more. Type 'help' to see commands.");
  }

  // Initialize charts cache
  state.charts = state.charts || {};

  // Error handling
  window.addEventListener("error", (e)=>{
    console.error(e.error||e.message);
    toast("Script error", "Something crashed. Refresh and try again. If it persists, tell me what you clicked.");
  });

  // First render
  render();
})();
</script>



</body>
</html>
